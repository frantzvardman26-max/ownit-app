name: Vindie Record (Android, owner only)
on:
  workflow_dispatch:
# Built here, in the public download repo, because GitHub Actions is free for public repositories.
# The code is checked out from the private repo with BUILD_TOKEN; only the finished app is published.
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: frantzvardman26-max/3D   # the private code; this public repo only runs the build (free minutes)
          token: ${{ secrets.BUILD_TOKEN }}
      - name: Build number (continues from the old private builds so phones accept the update)
        run: echo "APP_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Keep Gradle between builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
            ~/.m2/repository/org/robolectric
          key: gradle-vr-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/vindierecord/build.gradle.kts') }}-r1
          restore-keys: gradle-
      - name: Build Vindie Record
        working-directory: android
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties || true
          chmod +x gradlew
          for try in 1 2 3 4; do
            if ./gradlew :vindierecord:assembleDebug --no-daemon; then break; fi
            if [ $try = 4 ]; then exit 1; fi
            echo "Build attempt $try failed, waiting and trying again..."
            sleep 45
          done
          cp vindierecord/build/outputs/apk/debug/vindierecord-debug.apk ../VindieRecord.apk
          ls -la ../VindieRecord.apk; sha256sum ../VindieRecord.apk
      - name: Tests (encryption, private-field skipping, backup and restore)
        working-directory: android
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew :vindierecord:testDebugUnitTest --no-daemon && break; [ $i = 3 ] && exit 1; echo "Tests could not run (often a download limit); trying again in 90s"; sleep 90; done
      - name: "Save to the private app vault only (owner-only app, no public page, no F-Droid)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          # Owner-only: the file goes to the private vault and nowhere public.
          npx --yes wrangler@4 r2 object put "fv-app-vault/build/VindieRecord.apk" --file VindieRecord.apk --remote >/dev/null 2>&1 || { echo "::error::Could not save to the vault"; exit 1; }
          npx --yes wrangler@4 r2 object put "fv-app-vault/repo/VindieRecord.apk" --file VindieRecord.apk --remote >/dev/null 2>&1 || { echo "::error::Could not save the Free Lane copy"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); B=$("$BT/aapt2" dump badging VindieRecord.apk | head -1)
          VC=$(echo "$B" | sed -E "s/.* versionCode='([^']+)'.*/\1/"); VN=$(echo "$B" | sed -E "s/.* versionName='([^']+)'.*/\1/")
          python3 - "$VC" "$VN" "$(sha256sum VindieRecord.apk | cut -d' ' -f1)" "$(stat -c%s VindieRecord.apk)" <<'PY'
          import json, sys
          vc, vn, sha, sz = sys.argv[1:5]
          json.dump([{"packageName": "com.frantzvardman.vindierecord", "name": "Vindie Record", "summary": "Private records and keyboard audit (owner only)", "authorName": "Frantz Vardman",
                      "apk": "https://shop.frantzmichaelsthilairevardman.com/r/VindieRecord.apk", "sha256": sha, "size": int(sz), "versionCode": int(vc), "versionName": vn,
                      "minSdkVersion": 26, "icon": "https://shop.frantzmichaelsthilairevardman.com/img/app/vindierecord.png", "screenshots": [], "description": "Vindie Record: encrypted notes and records plus a visible keyboard audit. No internet permission. Owner only."}], open("owner-extras-record.json", "w"))
          PY
          npx --yes wrangler@4 r2 object put "fv-app-vault/repo/owner-extras-record.json" --file owner-extras-record.json --content-type application/json --remote >/dev/null 2>&1 && echo "Owner-only listing saved" || { echo "::error::Could not save the listing"; exit 1; }
