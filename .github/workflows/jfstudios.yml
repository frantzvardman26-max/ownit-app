name: Build J & F Studios
on:
  workflow_dispatch:
# Built here (public repo = free build minutes); the code comes from the private repo. The finished app goes to the
# private app vault, plus a 1-day build copy so the owner can grab it.
permissions:
  contents: read
  actions: write
concurrency:
  group: jfstudios
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: frantzvardman26-max/3D
          token: ${{ secrets.BUILD_TOKEN }}
      - name: Build number
        run: echo "APP_BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Keep Gradle between builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
            ~/.m2/repository/org/robolectric
          key: gradle-jfs-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/jfstudios/build.gradle.kts') }}-r1
          restore-keys: gradle-
      - name: Build J & F Studios
        working-directory: android
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties || true
          chmod +x gradlew
          for try in 1 2 3 4; do
            if ./gradlew :jfstudios:assembleDebug --no-daemon; then break; fi
            if [ $try = 4 ]; then exit 1; fi
            echo "Build attempt $try failed, trying again..."; sleep 45
          done
          cp jfstudios/build/outputs/apk/debug/jfstudios-debug.apk ../JFStudios.apk
          ls -la ../JFStudios.apk
      - name: Save to the private app vault
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 r2 object put "fv-app-vault/build/JFStudios.apk" --file JFStudios.apk --remote >/dev/null 2>&1 && echo "Saved" || echo "::warning::Could not save to the vault"
      - name: Refresh the F-Droid library so Free Lane sees this update
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fdroid-repo.yml -R "$GITHUB_REPOSITORY" || echo "::warning::Couldn't start the F-Droid refresh"
