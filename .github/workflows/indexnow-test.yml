name: IndexNow test (one page per site; shows the full answer)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K=b9b0291a9b5d8d4d1dcc0c120304d176
          for ep in https://api.indexnow.org/indexnow https://www.bing.com/indexnow https://yandex.com/indexnow; do
            for h in shop.frantzmichaelsthilairevardman.com fv-frantzvardmantrust.pages.dev; do
              echo "=== $ep  $h (GET form)"; curl -s -o b.txt -w '%{http_code}\n' "$ep?url=https://$h/&key=$K&keyLocation=https://$h/$K.txt"; head -c 300 b.txt; echo
            done
          done
          echo "=== shop sitemap hosts:"; curl -s https://shop.frantzmichaelsthilairevardman.com/sitemap.xml | grep -o '<loc>https://[^/]*' | sort | uniq -c
