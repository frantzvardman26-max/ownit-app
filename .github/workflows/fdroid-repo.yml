name: F-Droid app library
# Why: apps installed from a download link never update themselves. This publishes every app as a private F-Droid
# repository. Add it once in F-Droid and the phone shows "Update available" whenever a new build ships.
# The library is rebuilt after any app build finishes (no daily run: it saves free build minutes).
on:
  workflow_run:
    workflows: ["Build Own It", "Build Safe to Spend", "Build Lead Hunter", "Build Safe Pocket", "Build Bombs & Bullion", "Build Pure Beats", "Build Signal Fire", "Build Clear Check", "Build Rex Voice", "Build Free Lane", "Build Bayou Burger"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: fdroid-repo
  cancel-in-progress: true   # many builds finishing together only need the last refresh
jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: frantzvardman26-max/3D   # the private code; this public repo only runs the build (free minutes)
          token: ${{ secrets.BUILD_TOKEN }}
      - name: Install F-Droid tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fdroidserver apksigner > /dev/null
          fdroid --version || true
      - name: Repository signing key (made once, stored encrypted in this repo)
        env:
          PW: ${{ secrets.OWNIT_RELEASE_PASSWORD }}
        run: |
          set -e
          mkdir -p fd && cd fd
          ENC=../fdroid/repo-keystore.p12.enc
          if [ -f "$ENC" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in "$ENC" -out keystore.p12 -pass env:PW
          else
            keytool -genkeypair -keystore keystore.p12 -storetype PKCS12 -storepass:env PW -keypass:env PW -alias fdroid-repo \
              -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Frantz Vardman Apps, O=Frantz Vardman Shop"
            mkdir -p ../fdroid
            openssl enc -aes-256-cbc -pbkdf2 -salt -in keystore.p12 -out "$ENC" -pass env:PW
            cd .. && git config user.name "github-actions" && git config user.email "actions@github.com"
            git add fdroid/repo-keystore.p12.enc && git commit -m "F-Droid library: encrypted signing key [skip ci]" && git pull --rebase -q && git push -q
          fi
      - name: Collect the latest APKs
        run: |
          cd fd && mkdir -p repo metadata
          get() { curl -fsSL --retry 3 -o "repo/$1" "$2" && echo "got $1" || { echo "::warning::Couldn't download $1"; rm -f "repo/$1"; }; }
          get OwnIt.apk https://github.com/frantzvardman26-max/ownit-app/releases/latest/download/OwnIt.apk
          get SafeToSpend.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/safetospend/SafeToSpend.apk
          get LeadHunter.apk https://github.com/frantzvardman26-max/leadhunter-app/releases/latest/download/LeadHunter.apk
          get SafePocket.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/safepocket/SafePocket.apk
          get BombsAndBullion.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/crownrush/CrownRush.apk
          get PureBeats.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/purebeats/PureBeats.apk
          get SignalFire.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/signalfire/SignalFire.apk
          get ClearCheck.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/clearcheck/ClearCheck.apk
          get FreeLane.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/freelane/FreeLane.apk
          get Lovly.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/lovly/Lovly.apk
          get Reclaim.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/reclaim/Reclaim.apk
          get GiantsAndGuns.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/giants/GiantsAndGuns.apk
          get VindieAds.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/vindie/VindieAds.apk
          get PalmDistribute.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/palm/PalmDistribute.apk
          get VindieNews.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/vindienews/VindieNews.apk
          get BayouBurger.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/bayouburger/BayouBurger.apk
          # Rex Voice is left out: ~220 MB with its voice model, over GitHub's 100 MB file limit for this branch.
          find repo -name "*.apk" -size +95M -print -delete
          ls -la repo
      - name: App descriptions
        run: |
          cd fd/metadata
          m() { printf 'Name: "%s"\nAuthorName: %s\nWebSite: %s\nCategories:\n  - %s\nSummary: "%s"\nDescription: |\n  %s\n' "$5" "${6:-Frantz Vardman}" "${7:-https://shop.frantzmichaelsthilairevardman.com}" "$2" "$3" "$4" > "$1.yml"; }  # optional 6th/7th: author, website (apps made for clients)
          m com.ownit.app Multimedia "Music contracts, royalties and business tools for artists" "Scan contracts, track royalties, invoices and shows. No account, no ads." "Own It"
          m com.safetospend.app Money "Know what's safe to spend until payday" "Offline budget app: bills, debts, subscriptions and a cash-flow timeline. No bank login." "Safe to Spend"
          m com.leadhunter.app Office "Lead finder for roofing and window teams" "Find, track and follow up on leads." "Lead Hunter"
          m com.frantzvardman.safepocket Security "Keep your ID and papers safe on your phone" "Encrypted vault, reminders and help guides in English, Spanish and Haitian Creole. No internet permission." "Safe Pocket"
          m com.frantzvardman.crownrush Games "Catch the gold, dodge the bombs" "Bombs & Bullion: a one-thumb arcade game starring 10 animal superheroes. Catch the gold, dodge the bombs, grab the lightning to unleash your hero's power, and beat the Bomb King. Offline." "Bombs & Bullion"
          m com.frantzvardman.giants Games "A side-view shooter: endless rooms, 4 giants" "Giants & Guns: run, jump and blast your way through room after room while your gun aims itself. Level up and pick power-ups like Purple Love Slime, Bounce Ball, Boom Headphones and the Haymaker Glove, then take down Big Head, Brow, Grimjaw and KRAMP the Sleeping Giant. Free and offline, nothing collected. Want more? The Gold Edition (no ads, 500 gold, the Golden Gatling) is in the Frantz Vardman Shop." "Giants & Guns"
          m com.frantzvardman.vindie Internet "BETA · Advertise your business on Frantz Vardman sites and apps" "BETA. Vindie Ads: book an ad from \$25 a week. Add a headline, picture and link, see a live preview, pay in your browser, and track your ad's views. Ads rotate fairly with no trackers." "Vindie Ads (Beta)"
          m com.frantzvardman.palm Multimedia "BETA · Merch for independent artists" "BETA. Palm Distribute Music: apply in three quick steps, set up your own merch store and artist page, and keep your rights. Checkout opens in your browser. No trackers." "Palm Distribute (Beta)"
          m com.frantzvardman.vindienews Reading "New apps, games, tools and deals" "Vindie News: every new app, game, tool and deal from Frantz Vardman, the moment it drops. Read the latest issues, share them, and subscribe by email if you like. No account, no ads, nothing collected." "Vindie News"
          m com.frantzvardman.purebeats Multimedia "Make beats from scratch: drum pads and a live step grid" "Beat Pad: 8 pads, a 16-step grid that plays live, tempo, swing, 3 kits and 4 patterns. Plus an idea maker. Every sound is made on your phone (no samples). Export the beat with stems and a certificate of originality." "Pure Beats"
          m com.frantzvardman.signalfire Connectivity "Stay in touch with people nearby when there's no signal" "Phone-to-phone chat, supplies board, shared places and sourced first aid. No internet needed." "Signal Fire"
          m com.frantzvardman.clearcheck Office "A plain-English check-up for your business" "Paperwork, red flags, money and plain talk: a score, a fix list with official sources and a PDF report." "Clear Check"
          m com.frantzvardman.freelane System "A free app store with no gatekeepers" "Install and update free apps. Every download is checked against its SHA-256 fingerprint before it installs. No account, no ads, nothing collected." "Free Lane"
          m com.bayouburgerllc.app Internet "Order Bayou Burger: gourmet burgers with southern soul, Houston" "Browse the full Bayou Burger menu with prices and order delivery on DoorDash, Uber Eats, Grubhub or Instacart. Open 24 hours. No account needed." "Bayou Burger" "Bayou Burger LLC" "https://bayouburgerllc.com"
          m com.frantzvardman.lovly Money "Credit repair you do yourself: Learn, Make, Record, Send" "Learn your credit rights, make dispute and debt-validation letters that cite the exact law, track every legal deadline, and print or share them. Free, no account, no ads, no internet permission." "Lovly: Credit Repair"
          m com.frantzvardman.reclaim Security "Protect your name, number and peace" "Log evidence of harassment or misuse of your name and number, write takedown, data-broker and stop-contact letters that state the law accurately, and find the right help. Free, no account, no internet permission." "Reclaim: Name & Privacy Defense"
          m com.frantzvardman.rexvoice Multimedia "Clone your voice on your phone, with consent" "Record 2 to 5 minutes of your voice, add the speaker's spoken consent, and Rex Voice clones it on the phone itself (Pocket TTS by Kyutai, CC BY 4.0). Turn scripts into narration in that voice. Nothing is uploaded: no internet permission." "Rex Voice"
      - name: Icons and screenshots for each app's page
        env:
          GT: ${{ github.token }}
        run: |
          # Why: F-Droid can't draw the apps' vector launcher icons, so it shows a generic robot. These PNGs are drawn
          # from the same icons (shop/tools/make_app_icons.py); screenshots come from each app's screen tests.
          cd fd
          icon() { mkdir -p "metadata/$1/en-US/phoneScreenshots"; cp "../shop/site/img/app/$2.png" "metadata/$1/en-US/icon.png"; }
          icon com.ownit.app ownit; icon com.safetospend.app safetospend; icon com.leadhunter.app leadhunter
          icon com.frantzvardman.safepocket safepocket; icon com.frantzvardman.crownrush crownrush; icon com.frantzvardman.purebeats purebeats
          icon com.frantzvardman.signalfire signalfire; icon com.frantzvardman.clearcheck clearcheck; icon com.frantzvardman.rexvoice rexvoice; icon com.frantzvardman.freelane freelane; icon com.frantzvardman.lovly lovly; icon com.frantzvardman.reclaim reclaim; icon com.bayouburgerllc.app bayouburger
          mkdir -p metadata/com.frantzvardman.giants/en-US/phoneScreenshots; cp ../android/giants/docs/icon.png metadata/com.frantzvardman.giants/en-US/icon.png
          mkdir -p metadata/com.frantzvardman.vindie/en-US/phoneScreenshots; cp ../android/vindie/docs/icon.png metadata/com.frantzvardman.vindie/en-US/icon.png
          mkdir -p metadata/com.frantzvardman.palm/en-US/phoneScreenshots; cp ../android/palm/docs/icon.png metadata/com.frantzvardman.palm/en-US/icon.png
          mkdir -p metadata/com.frantzvardman.vindienews/en-US; cp ../android/vindienews/docs/icon.png metadata/com.frantzvardman.vindienews/en-US/icon.png
          shots() { T=$(mktemp -d); git clone -q --depth 1 -b "$2" "https://x-access-token:${GT}@github.com/${GITHUB_REPOSITORY}.git" "$T" 2>/dev/null || { echo "::warning::no $2"; return 0; }
            i=1; for f in $3; do [ -f "$T/$f" ] && cp "$T/$f" "metadata/$1/en-US/phoneScreenshots/$i.png" && i=$((i+1)); done; }
          shots com.frantzvardman.safepocket sp-screens "en-1-papers.png en-2-dates.png en-4-guides.png 07-lock.png"
          shots com.frantzvardman.crownrush cr-screens "cr-1-title.png cr-2-playing.png cr-4b-hero-profile.png cr-7-roster.png"
          shots com.frantzvardman.giants gg-screens "gg-1-title.png gg-2-playing.png gg-3-powerup.png gg-4-giant.png"
          shots com.frantzvardman.purebeats pb-screens "pb-1-home.png"
          shots com.frantzvardman.signalfire sf-screens "sf-1-nearby.png sf-2-supplies.png sf-3-places.png sf-4-aid.png"
          shots com.frantzvardman.clearcheck cc-screens "cc-1-home-empty.png cc-2-question.png cc-3-home-scored.png cc-4-report.png"
          shots com.frantzvardman.freelane fl-screens "fl-1-discover.png fl-2-updates.png fl-3-submit.png"
          shots com.frantzvardman.lovly lv-screens "lv-1-learn.png lv-5-make-review.png lv-6-record.png lv-7-case-late.png lv-8-send.png"
          shots com.frantzvardman.reclaim rc-screens "rc-1-learn.png rc-2-log.png rc-4-make.png rc-5-letter.png rc-6-help.png"
          shots com.frantzvardman.rexvoice rv-screens "rv-1-record.png rv-4-vault.png rv-5-narrator.png rv-3-consent.png"
          shots com.safetospend.app sts-screens "normal_1_home.png normal_2_activity.png normal_3_bills.png"
          find metadata -name '*.png' | sort
      - name: Build and sign the library
        env:
          PW: ${{ secrets.OWNIT_RELEASE_PASSWORD }}
        run: |
          set -e
          cd fd
          cat > config.yml <<EOF
          repo_url: https://raw.githubusercontent.com/frantzvardman26-max/ownit-app/fdroid/repo
          repo_name: Frantz Vardman Apps
          repo_description: Free offline Android apps by Frantz Vardman. No accounts, no ads.
          repo_keyalias: fdroid-repo
          keystore: keystore.p12
          keystorepass: "$PW"
          keypass: "$PW"
          keydname: CN=Frantz Vardman Apps, O=Frantz Vardman Shop
          EOF
          chmod 600 config.yml
          fdroid update --create-metadata
          ls repo | head -30
          FP=$(keytool -list -v -keystore keystore.p12 -storepass:env PW -alias fdroid-repo | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //; s/://g')
          echo "FINGERPRINT=$FP" >> $GITHUB_ENV
          rm -f keystore.p12 config.yml
      - name: Extras for Free Lane (apps the library can't hold)
        run: |
          # Own It (signing-key change the library's tools reject) and Rex Voice (too big for this branch) are listed in
          # repo/extras.json with their release links and SHA-256 fingerprints, so Free Lane can still install them.
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); T=$(mktemp -d); SHOP=https://shop.frantzmichaelsthilairevardman.com
          entry() { # package-hint url name summary icon "shots"
            curl -fsSL --retry 3 -o "$T/a.apk" "$2" || { echo "::warning::no $3"; return 0; }
            B=$("$BT/aapt2" dump badging "$T/a.apk" | head -1)
            # Anchored matches: newer aapt2 adds compileSdkVersionCodename='16', which a loose "name='" match picked up as the package.
            PKG=$(echo "$B" | sed -E "s/^package: name='([^']+)'.*/\1/"); VC=$(echo "$B" | sed -E "s/.* versionCode='([^']+)'.*/\1/"); VN=$(echo "$B" | sed -E "s/.* versionName='([^']+)'.*/\1/")
            echo "$PKG" | grep -Eq '^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$' || { echo "::error::Bad package name '$PKG' for $3"; exit 1; }
            SHA=$(sha256sum "$T/a.apk" | cut -d' ' -f1); SZ=$(stat -c%s "$T/a.apk")
            python3 - "$PKG" "$VC" "$VN" "$SHA" "$SZ" "$2" "$3" "$4" "$5" "$6" <<'PY'
          import json, sys, os
          pkg, vc, vn, sha, sz, apk, name, summary, icon, shots = sys.argv[1:11]
          f = 'fd/repo/extras.json'; cur = json.load(open(f)) if os.path.exists(f) else []
          cur.append({"packageName": pkg, "name": name, "summary": summary, "authorName": "Frantz Vardman", "apk": apk, "sha256": sha, "size": int(sz),
                      "versionCode": int(vc), "versionName": vn, "minSdkVersion": 26, "icon": icon, "screenshots": [s for s in shots.split() if s]})
          json.dump(cur, open(f, 'w'), indent=1)
          PY
            echo "extra: $PKG $VN"; }
          rm -f fd/repo/extras.json
          entry ownit https://github.com/frantzvardman26-max/ownit-app/releases/latest/download/OwnIt.apk "Own It" "Music contracts, royalties and business tools for artists" "$SHOP/img/app/ownit.png" ""
          entry rexvoice https://github.com/frantzvardman26-max/ownit-app/releases/download/rexvoice/RexVoice.apk "Rex Voice" "Clone your voice on your phone, with consent" "$SHOP/img/app/rexvoice.png" "$SHOP/img/app/shots/rexvoice-1.webp $SHOP/img/app/shots/rexvoice-2.webp $SHOP/img/app/shots/rexvoice-3.webp $SHOP/img/app/shots/rexvoice-4.webp"
          [ -f fd/repo/extras.json ] && cat fd/repo/extras.json | head -40 || echo "[]" > fd/repo/extras.json
      - name: What's new notes (android/<app>/docs/WHATSNEW.md -> repo/whatsnew.json, shown in Free Lane)
        run: |
          python3 - <<'PY'
          import glob, json, os, re
          out = {}
          for f in glob.glob('android/*/docs/WHATSNEW.md'):
              g = open(os.path.join(os.path.dirname(os.path.dirname(f)), 'build.gradle.kts')).read() if os.path.exists(os.path.join(os.path.dirname(os.path.dirname(f)), 'build.gradle.kts')) else ''
              m = re.search(r'applicationId\s*=\s*"([^"]+)"', g)
              if m: out[m.group(1)] = open(f).read().strip()[:1200]
          json.dump(out, open('fd/repo/whatsnew.json', 'w'), indent=1)
          print(json.dumps(out, indent=1)[:1500])
          PY
      - name: Publish (branch "fdroid" of the public download repo)
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then echo "No publish token"; exit 0; fi
          T=$(mktemp -d); cp -r fd/repo "$T/repo"
          cat > "$T/README.md" <<EOF
          # Frantz Vardman Apps (F-Droid library)
          
          In F-Droid: Settings > Repositories > + and paste:
          
          https://raw.githubusercontent.com/frantzvardman26-max/ownit-app/fdroid/repo?fingerprint=$FINGERPRINT
          EOF
          cd "$T" && git init -q && git checkout -q -b fdroid && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "F-Droid library, built from ${GITHUB_SHA::7}"
          # Why force and a fresh history: APKs are big; keeping only the latest build keeps the library small.
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/frantzvardman26-max/ownit-app.git" fdroid
          echo "Add in F-Droid: https://raw.githubusercontent.com/frantzvardman26-max/ownit-app/fdroid/repo?fingerprint=$FINGERPRINT"
      - name: Refresh the Free Lane website with the new catalog
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run freelane-site.yml -R "$GITHUB_REPOSITORY" || echo "::warning::Couldn't start the website refresh"
