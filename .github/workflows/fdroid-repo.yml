name: F-Droid app library
# Why: apps installed from a download link never update themselves. This publishes every app as a private F-Droid
# repository. Add it once in F-Droid and the phone shows "Update available" whenever a new build ships.
# The library is rebuilt after any app build finishes (no daily run: it saves free build minutes).
on:
  workflow_run:
    workflows: ["Build Own It", "Build Safe to Spend", "Build Lead Hunter", "Build Safe Pocket", "Build Bombs & Bullion", "Build Pure Beats", "Build Signal Fire", "Build Clear Check", "Build Rex Voice"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fdroid-repo
  cancel-in-progress: true   # many builds finishing together only need the last refresh
jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: frantzvardman26-max/3D   # the private code; this public repo only runs the build (free minutes)
          token: ${{ secrets.BUILD_TOKEN }}
      - name: Install F-Droid tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fdroidserver apksigner > /dev/null
          fdroid --version || true
      - name: Repository signing key (made once, stored encrypted in this repo)
        env:
          PW: ${{ secrets.OWNIT_RELEASE_PASSWORD }}
        run: |
          set -e
          mkdir -p fd && cd fd
          ENC=../fdroid/repo-keystore.p12.enc
          if [ -f "$ENC" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in "$ENC" -out keystore.p12 -pass env:PW
          else
            keytool -genkeypair -keystore keystore.p12 -storetype PKCS12 -storepass:env PW -keypass:env PW -alias fdroid-repo \
              -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Frantz Vardman Apps, O=Frantz Vardman Shop"
            mkdir -p ../fdroid
            openssl enc -aes-256-cbc -pbkdf2 -salt -in keystore.p12 -out "$ENC" -pass env:PW
            cd .. && git config user.name "github-actions" && git config user.email "actions@github.com"
            git add fdroid/repo-keystore.p12.enc && git commit -m "F-Droid library: encrypted signing key [skip ci]" && git pull --rebase -q && git push -q
          fi
      - name: Collect the latest APKs
        run: |
          cd fd && mkdir -p repo metadata
          get() { curl -fsSL --retry 3 -o "repo/$1" "$2" && echo "got $1" || { echo "::warning::Couldn't download $1"; rm -f "repo/$1"; }; }
          get OwnIt.apk https://github.com/frantzvardman26-max/ownit-app/releases/latest/download/OwnIt.apk
          get SafeToSpend.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/safetospend/SafeToSpend.apk
          get LeadHunter.apk https://github.com/frantzvardman26-max/leadhunter-app/releases/latest/download/LeadHunter.apk
          get SafePocket.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/safepocket/SafePocket.apk
          get BombsAndBullion.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/crownrush/CrownRush.apk
          get PureBeats.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/purebeats/PureBeats.apk
          get SignalFire.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/signalfire/SignalFire.apk
          get ClearCheck.apk https://github.com/frantzvardman26-max/ownit-app/releases/download/clearcheck/ClearCheck.apk
          # Rex Voice is left out: ~220 MB with its voice model, over GitHub's 100 MB file limit for this branch.
          find repo -name "*.apk" -size +95M -print -delete
          ls -la repo
      - name: App descriptions
        run: |
          cd fd/metadata
          m() { printf 'Name: %s\nAuthorName: Frantz Vardman\nWebSite: https://shop.frantzmichaelsthilairevardman.com\nCategories:\n  - %s\nSummary: %s\nDescription: |\n  %s\n' "$5" "$2" "$3" "$4" > "$1.yml"; }
          m com.ownit.app Multimedia "Music contracts, royalties and business tools for artists" "Scan contracts, track royalties, invoices and shows. No account, no ads." "Own It"
          m com.safetospend.app Money "Know what's safe to spend until payday" "Offline budget app: bills, debts, subscriptions and a cash-flow timeline. No bank login." "Safe to Spend"
          m com.leadhunter.app Office "Lead finder for roofing and window teams" "Find, track and follow up on leads." "Lead Hunter"
          m com.frantzvardman.safepocket Security "Keep your ID and papers safe on your phone" "Encrypted vault, reminders and help guides in English, Spanish and Haitian Creole. No internet permission." "Safe Pocket"
          m com.frantzvardman.crownrush Games "Catch the gold, dodge the bombs" "Bombs & Bullion: a one-thumb arcade game with power-ups, missions and the Bomb King. Offline." "Bombs & Bullion"
          m com.frantzvardman.purebeats Multimedia "100% original beats made on your phone" "No samples, no loops. Export the beat, 7 stems and a certificate of originality." "Pure Beats"
          m com.frantzvardman.signalfire Connectivity "Stay in touch with people nearby when there's no signal" "Phone-to-phone chat, supplies board, shared places and sourced first aid. No internet needed." "Signal Fire"
          m com.frantzvardman.clearcheck Office "A plain-English check-up for your business" "Paperwork, red flags, money and plain talk: a score, a fix list with official sources and a PDF report." "Clear Check"
          m com.frantzvardman.rexvoice Multimedia "Clone your voice on your phone, with consent" "Record 2 to 5 minutes of your voice, add the speaker's spoken consent, and Rex Voice clones it on the phone itself (Pocket TTS by Kyutai, CC BY 4.0). Turn scripts into narration in that voice. Nothing is uploaded: no internet permission." "Rex Voice"
      - name: Icons and screenshots for each app's page
        env:
          GT: ${{ github.token }}
        run: |
          # Why: F-Droid can't draw the apps' vector launcher icons, so it shows a generic robot. These PNGs are drawn
          # from the same icons (shop/tools/make_app_icons.py); screenshots come from each app's screen tests.
          cd fd
          icon() { mkdir -p "metadata/$1/en-US/phoneScreenshots"; cp "../shop/site/img/app/$2.png" "metadata/$1/en-US/icon.png"; }
          icon com.ownit.app ownit; icon com.safetospend.app safetospend; icon com.leadhunter.app leadhunter
          icon com.frantzvardman.safepocket safepocket; icon com.frantzvardman.crownrush crownrush; icon com.frantzvardman.purebeats purebeats
          icon com.frantzvardman.signalfire signalfire; icon com.frantzvardman.clearcheck clearcheck; icon com.frantzvardman.rexvoice rexvoice
          shots() { T=$(mktemp -d); git clone -q --depth 1 -b "$2" "https://x-access-token:${GT}@github.com/${GITHUB_REPOSITORY}.git" "$T" 2>/dev/null || { echo "::warning::no $2"; return 0; }
            i=1; for f in $3; do [ -f "$T/$f" ] && cp "$T/$f" "metadata/$1/en-US/phoneScreenshots/$i.png" && i=$((i+1)); done; }
          shots com.frantzvardman.safepocket sp-screens "en-1-papers.png en-2-dates.png en-4-guides.png 07-lock.png"
          shots com.frantzvardman.crownrush cr-screens "cr-1-title.png cr-2-playing.png cr-3-level-up.png cr-6-results.png"
          shots com.frantzvardman.purebeats pb-screens "pb-1-home.png"
          shots com.frantzvardman.signalfire sf-screens "sf-1-nearby.png sf-2-supplies.png sf-3-places.png sf-4-aid.png"
          shots com.frantzvardman.clearcheck cc-screens "cc-1-home-empty.png cc-2-question.png cc-3-home-scored.png cc-4-report.png"
          shots com.frantzvardman.rexvoice rv-screens "rv-1-record.png rv-4-vault.png rv-5-narrator.png rv-3-consent.png"
          shots com.safetospend.app sts-screens "normal_1_home.png normal_2_activity.png normal_3_bills.png"
          find metadata -name '*.png' | sort
      - name: Build and sign the library
        env:
          PW: ${{ secrets.OWNIT_RELEASE_PASSWORD }}
        run: |
          set -e
          cd fd
          cat > config.yml <<EOF
          repo_url: https://raw.githubusercontent.com/frantzvardman26-max/ownit-app/fdroid/repo
          repo_name: Frantz Vardman Apps
          repo_description: Free offline Android apps by Frantz Vardman. No accounts, no ads.
          repo_keyalias: fdroid-repo
          keystore: keystore.p12
          keystorepass: "$PW"
          keypass: "$PW"
          keydname: CN=Frantz Vardman Apps, O=Frantz Vardman Shop
          EOF
          chmod 600 config.yml
          fdroid update --create-metadata
          ls repo | head -30
          FP=$(keytool -list -v -keystore keystore.p12 -storepass:env PW -alias fdroid-repo | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //; s/://g')
          echo "FINGERPRINT=$FP" >> $GITHUB_ENV
          rm -f keystore.p12 config.yml
      - name: Publish (branch "fdroid" of the public download repo)
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then echo "No publish token"; exit 0; fi
          T=$(mktemp -d); cp -r fd/repo "$T/repo"
          cat > "$T/README.md" <<EOF
          # Frantz Vardman Apps (F-Droid library)
          
          In F-Droid: Settings > Repositories > + and paste:
          
          https://raw.githubusercontent.com/frantzvardman26-max/ownit-app/fdroid/repo?fingerprint=$FINGERPRINT
          EOF
          cd "$T" && git init -q && git checkout -q -b fdroid && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "F-Droid library, built from ${GITHUB_SHA::7}"
          # Why force and a fresh history: APKs are big; keeping only the latest build keeps the library small.
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/frantzvardman26-max/ownit-app.git" fdroid
          echo "Add in F-Droid: https://raw.githubusercontent.com/frantzvardman26-max/ownit-app/fdroid/repo?fingerprint=$FINGERPRINT"
