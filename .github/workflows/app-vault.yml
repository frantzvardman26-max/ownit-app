name: App vault (copy every app file into the private vault)
# Why: app files must only reach people who signed in. This copies each app's latest file into the private R2 bucket
# "fv-app-vault" (no public access). The shop's /get/<app> and Free Lane's /r/<file> serve them from there, only to signed-in accounts.
# Runs after the F-Droid library refreshes, every 6 hours, and on demand. Nothing about any person is used or logged.
on:
  workflow_run:
    workflows: ["F-Droid app library"]
    types: [completed]
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-vault
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: frantzvardman26-max/3D
          token: ${{ secrets.BUILD_TOKEN }}
          sparse-checkout: |
            shop/site/functions/api/_apps.js
            shop/tools/connect_app_vault.sh
      - name: Make sure the private bucket exists
        run: bash shop/tools/connect_app_vault.sh frantz-vardman-shop
      - name: Copy the Free Lane library files (same bytes, so Free Lane's checks still match)
        run: |
          mkdir -p lib && cd lib
          git init -q && git remote add o https://github.com/${{ github.repository }} && git fetch -q --depth 1 o fdroid && git checkout -q FETCH_HEAD -- repo || true
          n=0; for f in repo/*.apk; do [ -f "$f" ] || continue
            npx --yes wrangler@4 r2 object put "fv-app-vault/repo/$(basename "$f")" --file "$f" --content-type application/vnd.android.package-archive --remote > put.log 2>&1 && n=$((n+1)) || tail -4 put.log; done
          echo "library files in the vault: $n"
      - name: Copy each app's download file
        run: |
          mkdir -p apps
          python3 -c "import re;t=open('shop/site/functions/api/_apps.js').read();[print(i,u) for i,u in re.findall(r\"\\{ id: '([a-z0-9]+)'.*?file: '([^']+)'\",t,re.S)]" > apps.txt; cat apps.txt | cut -d' ' -f1 | tr '\n' ' '
          n=0; while read -r id url; do
            if curl -fsSL "$url" -o "apps/$id.apk"; then npx --yes wrangler@4 r2 object put "fv-app-vault/apps/$id.apk" --file "apps/$id.apk" --content-type application/vnd.android.package-archive --remote > put.log 2>&1 && n=$((n+1)) || tail -4 put.log; else echo "::warning::no file yet for $id"; fi
          done < apps.txt
          echo "app files in the vault: $n of $(wc -l < apps.txt)"
