name: Free Lane website
# Builds fv-freelane.pages.dev from the live store catalog and publishes it on Cloudflare Pages.
# Runs after every F-Droid library refresh (so the site always lists what the app shows) and when its code changes.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: freelane-site
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: frantzvardman26-max/3D   # the private code; this public repo only runs the build (free minutes)
          token: ${{ secrets.BUILD_TOKEN }}
      - name: Build the site from the catalog
        run: python3 freelane-site/build.py
      - name: Publish to Cloudflare Pages (project fv-freelane)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::No Cloudflare secrets"; exit 0; fi
          cd freelane-site/dist
          npx --yes wrangler@3 pages project list | grep -q "fv-freelane" || npx --yes wrangler@3 pages project create fv-freelane --production-branch main
          npx --yes wrangler@3 pages deploy . --project-name fv-freelane --branch main --commit-dirty=true
          echo "Live: https://fv-freelane.pages.dev"
      - name: Tell search engines about new pages (IndexNow, no account)
        if: success()
        run: |
          python3 - "freelane-site/dist" "fv-freelane.pages.dev" <<'PY'
          import json, re, sys, glob, os, urllib.request
          dist, host = sys.argv[1], sys.argv[2]
          keys = [os.path.basename(f)[:-4] for f in glob.glob(dist + '/*.txt') if re.fullmatch(r'[0-9a-f]{32}', os.path.basename(f)[:-4])]
          if not keys: print('no IndexNow key file'); sys.exit(0)
          urls = re.findall(r'<loc>([^<]+)</loc>', open(dist + '/sitemap.xml').read())[:10000]
          body = json.dumps({"host": host, "key": keys[0], "keyLocation": f"https://{host}/{keys[0]}.txt", "urlList": urls}).encode()
          try:
              r = urllib.request.urlopen(urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"}), timeout=30)
              print("IndexNow:", r.status, len(urls), "pages")
          except Exception as e: print("IndexNow not accepted (fine, retried next deploy):", e)
          PY
