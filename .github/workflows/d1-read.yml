name: Read from the shop database (results encrypted to a one-time key; the log shows only ciphertext)
on:
  workflow_dispatch:
    inputs:
      file: {description: 'read-*.sql file name in shop/tools/sql/', required: true}
      pub: {description: 'One-time RSA public key, PEM, base64 on one line', required: true}
permissions: {contents: read}
jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
      F: ${{ inputs.file }}
      PUB: ${{ inputs.pub }}
    steps:
      - run: |
          case "$F" in read-*.sql) ;; *) echo "only read-*.sql files"; exit 1;; esac
          case "$F" in *[!A-Za-z0-9._-]*) echo "bad name"; exit 1;; esac
          gh api "repos/frantzvardman26-max/3D/contents/shop/tools/sql/$F" -q .content | base64 -d > q.sql
          grep -qiE '\b(insert|update|delete|drop|alter|create|replace)\b' q.sql && { echo "read-only queries only"; exit 1; }
          echo "$PUB" | base64 -d > pub.pem
          npx --yes wrangler@3 d1 execute shop-downloads --remote --json --command "$(tr "\n" " " < q.sql)" > out.json 2>/dev/null || { echo failed; exit 1; }
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -in out.json -out out.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out k.enc
          echo "KEY:$(base64 -w0 k.enc)"; echo "DATA:$(base64 -w0 out.enc)"; rm -f k.bin out.json
