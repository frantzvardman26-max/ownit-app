name: Live co-op check (is the party dungeon server reachable through the shop?)
# Opens a WebSocket handshake to /api/live without signing in. 401 = the server is connected and asking for an account (good).
# 503 = the shop isn't connected to the server. Shows only the status and the short reply.
on: workflow_dispatch
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl --http1.1 -s -o body.txt -w '%{http_code}' --max-time 15 -H 'Upgrade: websocket' -H 'Connection: Upgrade' -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' 'https://shop.frantzmichaelsthilairevardman.com/api/live?code=CHECK1')
          echo "status $code: $(head -c 80 body.txt)"
          [ "$code" = "401" ] && echo "live co-op server: connected" || { echo "live co-op server: NOT connected"; exit 1; }
