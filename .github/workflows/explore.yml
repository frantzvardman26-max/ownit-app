name: Button audit (tap every button on every app's first screen)
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Download the published apps
        run: |
          mkdir apks && cd apks
          for t in freelane lovly reclaim signalfire safetospend safepocket purebeats crownrush clearcheck; do gh release download $t -R "$GITHUB_REPOSITORY" -p '*.apk' || true; done
          gh release download v202 -R "$GITHUB_REPOSITORY" -p 'OwnIt.apk' || true
          gh release download store-files -R "$GITHUB_REPOSITORY" -p 'LeadHunter-store.apk' || true
          ls -la
      - name: Image tools
        run: pip install --quiet pillow
      - name: Tap everything
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 .github/explore.py apks explore
      - name: Publish the report and screenshots (branch "button-audit")
        if: always()
        run: |
          [ -d explore ] || exit 0
          cd explore && git init -q && git checkout -q -b button-audit && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "button audit" && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" button-audit
