name: Vindie free ad
# Starts a free Vindie ad (for friends or house ads) without payment. Skips if that business already has a free ad running.
on:
  workflow_dispatch:
    inputs:
      biz: { description: 'Business', required: true }
      headline: { description: 'Headline (40)', required: true }
      body: { description: 'Short line (90)', required: false, default: '' }
      url: { description: 'Link (https)', required: true }
      img_url: { description: 'Picture URL (optional)', required: false, default: '' }
      tier: { description: 'starter / boost / featured', required: true, default: featured }
      weeks: { description: 'Weeks', required: true, default: '1' }
permissions: { contents: read }
jobs:
  comp:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BIZ: ${{ inputs.biz }}
      HEADLINE: ${{ inputs.headline }}
      BODY: ${{ inputs.body }}
      URL: ${{ inputs.url }}
      IMG_URL: ${{ inputs.img_url }}
      TIER: ${{ inputs.tier }}
      WEEKS: ${{ inputs.weeks }}
    steps:
      - uses: actions/checkout@v4
      - name: Start it
        run: |
          pip install --quiet pillow
          npx -y wrangler@3 d1 execute shop-downloads --remote --command "CREATE TABLE IF NOT EXISTS vindie_ads (id INTEGER PRIMARY KEY AUTOINCREMENT, code TEXT UNIQUE, key TEXT, biz TEXT, email TEXT, headline TEXT, body TEXT, url TEXT, img TEXT, tier TEXT, weeks INTEGER DEFAULT 0, status TEXT, created TEXT, starts TEXT, ends TEXT, session TEXT, note TEXT)"
          python3 .github/vindie_comp.py
          npx -y wrangler@3 d1 execute shop-downloads --remote --file comp.sql
          npx -y wrangler@3 d1 execute shop-downloads --remote --json --command "SELECT id, biz, tier, status, starts, ends, note FROM vindie_ads WHERE status = 'running'" | jq -r '.[0].results[] | "\(.id) \(.biz) \(.tier) \(.status) until \(.ends) \(.note)"'
