name: Build Vindie Maps (owner only)
on:
  workflow_dispatch:
# Built here because GitHub Actions is free for public repositories. The code is checked out from the private repo;
# the finished app goes only to the private app vault (owner-only Free Lane listing), never to a public page.
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: frantzvardman26-max/3D
          token: ${{ secrets.BUILD_TOKEN }}
      - run: echo "APP_BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Keep Gradle between builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-vm-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/vindiemaps/build.gradle.kts') }}-r1
          restore-keys: gradle-
      - name: Build Vindie Maps
        working-directory: android
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties || true
          chmod +x gradlew
          for try in 1 2 3; do
            if ./gradlew :vindiemaps:assembleDebug --no-daemon; then break; fi
            [ $try = 3 ] && exit 1; echo "Build attempt $try failed, trying again"; sleep 45
          done
          cp vindiemaps/build/outputs/apk/debug/vindiemaps-debug.apk ../VindieMaps.apk
      - name: Tests (fingerprint chain, distance, GPX)
        working-directory: android
        run: |
          for i in 1 2 3; do ./gradlew :vindiemaps:testDebugUnitTest --no-daemon && break; [ $i = 3 ] && exit 1; sleep 60; done
      - name: Backups open with the real age tool
        run: |
          sudo apt-get install -y -qq age >/dev/null
          D=android/vindiemaps/build/agetest
          for n in small big exact empty; do age -d -i $D/key.txt -o /tmp/$n.out $D/$n.age && cmp $D/$n.bin /tmp/$n.out || { echo "::error::age could not open the $n backup"; exit 1; }; done
          echo "OK: all test backups decrypt with age"
      - name: Share screen-test screenshots for review (branch vm-screens)
        if: always()
        run: |
          D=android/vindiemaps/build/screens; [ -d "$D" ] || { echo "No screenshots"; exit 0; }
          T=$(mktemp -d); cp "$D"/*.png "$T"/ 2>/dev/null || exit 0
          cd "$T" && git init -q && git checkout -q -b vm-screens && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "screens"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vm-screens || echo "::warning::Couldn't push screenshots"
      - name: Permission check (no Google services, no accounts, no contacts)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          P=$("$BT/aapt2" dump permissions VindieMaps.apk); echo "$P"
          for bad in GET_ACCOUNTS READ_CONTACTS READ_PHONE_STATE CAMERA RECORD_AUDIO READ_SMS; do
            echo "$P" | grep -q "android.permission.$bad" && { echo "::error::Unexpected permission $bad"; exit 1; }
          done
          unzip -l VindieMaps.apk | grep -qi "com/google/android/gms" && { echo "::error::Google Play services found"; exit 1; } || true
          echo "OK"
      - name: Save to the private app vault (owner-only listing)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put "fv-app-vault/build/VindieMaps.apk" --file VindieMaps.apk --remote >/dev/null 2>&1 || { echo "::error::Could not save to the vault"; exit 1; }
          npx --yes wrangler@4 r2 object put "fv-app-vault/repo/VindieMaps.apk" --file VindieMaps.apk --remote >/dev/null 2>&1 || { echo "::error::Could not save the Free Lane copy"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); B=$("$BT/aapt2" dump badging VindieMaps.apk | head -1)
          VC=$(echo "$B" | sed -E "s/.* versionCode='([^']+)'.*/\1/"); VN=$(echo "$B" | sed -E "s/.* versionName='([^']+)'.*/\1/")
          python3 - "$VC" "$VN" "$(sha256sum VindieMaps.apk | cut -d' ' -f1)" "$(stat -c%s VindieMaps.apk)" <<'PY'
          import json, sys
          vc, vn, sha, sz = sys.argv[1:5]
          json.dump([{"packageName": "com.frantzvardman.vindiemaps", "name": "Vindie Maps", "summary": "Your own location history (owner only)", "authorName": "Frantz Vardman",
                      "apk": "https://shop.frantzmichaelsthilairevardman.com/r/VindieMaps.apk", "sha256": sha, "size": int(sz), "versionCode": int(vc), "versionName": vn,
                      "minSdkVersion": 26, "icon": "https://shop.frantzmichaelsthilairevardman.com/img/app/vindiemaps.png",
                      "screenshots": ["https://shop.frantzmichaelsthilairevardman.com/img/app/shots/vindiemaps-a.webp"],
                      "description": "Your own location history, recorded on your phone all day. Points can't be edited or deleted; each one is fingerprinted and chained to the last, so Check proves nothing changed. Save exports a day as GPX with every fingerprint. Map: OpenStreetMap. Nothing leaves your phone."}], open("owner-extras-maps.json", "w"))
          PY
          npx --yes wrangler@4 r2 object put "fv-app-vault/repo/owner-extras-maps.json" --file owner-extras-maps.json --content-type application/json --remote >/dev/null 2>&1 && echo "Owner-only listing saved" || { echo "::error::Could not save the listing"; exit 1; }
