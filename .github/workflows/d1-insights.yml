name: Database read usage (which queries read the most rows; results encrypted, the log shows only ciphertext)
on:
  workflow_dispatch:
    inputs:
      pub: {description: 'One-time RSA public key, PEM, base64 on one line', required: true}
permissions: {contents: read}
jobs:
  insights:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUB: ${{ inputs.pub }}
    steps:
      - run: |
          set +e
          echo "$PUB" | base64 -d > pub.pem
          { for t in 1d 7d; do echo "== $t"; npx --yes wrangler@4 d1 insights shop-downloads --timePeriod $t --sort-type sum --sort-by reads --limit 25 --json 2>&1; done
            echo "== databases"; npx --yes wrangler@4 d1 list --json 2>&1; } > out.json
          echo "bytes: $(wc -c < out.json)"
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -in out.json -out out.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out k.enc
          echo "KEY:$(base64 -w0 k.enc)"; echo "DATA:$(base64 -w0 out.enc)"; rm -f k.bin out.json
