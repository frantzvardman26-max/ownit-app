name: HTTP probe (status, headers and the first bytes of public URLs)
on:
  workflow_dispatch:
    inputs:
      urls: {description: 'Space-separated public URLs', required: true}
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env: { URLS: "${{ inputs.urls }}" }
        run: |
          for u in $URLS; do
            case "$u" in https://*) ;; *) echo "skip $u"; continue;; esac
            echo "=== $u"
            curl -s -o body.bin -D head.txt -A "Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)" --max-time 20 "$u" || true
            head -1 head.txt; grep -iE '^(content-type|location|cf-mitigated|server|content-length):' head.txt
            echo "body: $(head -c 120 body.bin | tr -d '\r' | tr '\n' ' ')"
          done
