name: Twin setup (practice copy of the shop, one time; safe to re-run)
# Makes the Twin: its own Cloudflare Pages project (frantz-twin) and its own database (twin-db), switches it to practice mode
# (TWIN=1: no emails, test payments only), gives it its own owner key, and opens the "twin" branch in the private repo.
# Public repo: nothing secret is printed.
on:
  workflow_dispatch:
    inputs:
      newkey: {description: 'Make a new twin key', type: boolean, default: false}
permissions: {contents: read, actions: write}
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
      BT: ${{ secrets.BUILD_TOKEN }}
    steps:
      - name: Database, project, settings, key, branch
        run: |
          set -e
          W="npx --yes wrangler@3"; B=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$@"; }
          ID=$(api "$B/d1/database?name=twin-db" | jq -r '.result[0].uuid // empty')
          [ -n "$ID" ] || ID=$(api -X POST "$B/d1/database" -d '{"name":"twin-db"}' | jq -r '.result.uuid // empty')
          [ -n "$ID" ] && echo "database ready" || { echo "::error::could not make the twin database"; exit 1; }
          api "$B/pages/projects/frantz-twin" | jq -e '.success' >/dev/null || api -X POST "$B/pages/projects" -d '{"name":"frantz-twin","production_branch":"main"}' | jq -r '"project: \(.success)"'
          LIVE=$(api "$B/pages/projects/frantz-vardman-shop"); CD=$(echo "$LIVE" | jq -r '.result.deployment_configs.production.compatibility_date // "2024-09-23"')
          q() { $W d1 execute shop-downloads --remote --json --command "$1" 2>/dev/null; }
          q "CREATE TABLE IF NOT EXISTS owner_secrets (name TEXT PRIMARY KEY, value TEXT)" >/dev/null
          KEY=$(q "SELECT value FROM owner_secrets WHERE name='twin_key'" | jq -r '.[0].results[0].value // empty')
          if [ -z "$KEY" ] || [ "${{ inputs.newkey }}" = "true" ]; then KEY=$(openssl rand -hex 24); NEW=1; fi
          echo "::add-mask::$KEY"
          URL=https://frantz-twin.pages.dev
          BODY=$(jq -n --arg id "$ID" --arg k "$KEY" --arg u "$URL" --arg g "$BT" --arg cd "$CD" '{deployment_configs:{production:{compatibility_date:$cd,
            d1_databases:{DB:{id:$id}}, env_vars:{TWIN:{type:"plain_text",value:"1"}, ACCOUNT_ORIGIN:{type:"plain_text",value:$u},
            PORTFOLIO_KEY:{type:"secret_text",value:$k}, GH_DISPATCH:{type:"secret_text",value:$g}}}}}')
          api -X PATCH "$B/pages/projects/frantz-twin" -d "$BODY" | jq -r '"settings saved: \(.success) \([.errors[]?.message])"'
          if [ -n "$NEW" ]; then q "INSERT OR REPLACE INTO owner_secrets (name, value) VALUES ('twin_key', '$KEY'), ('twin_url', '$URL')" >/dev/null && echo "key saved for the control panel"; fi
          SHA=$(gh api repos/frantzvardman26-max/3D/git/ref/heads/main -q .object.sha)
          gh api repos/frantzvardman26-max/3D/git/ref/heads/twin >/dev/null 2>&1 && echo "twin branch exists" || { gh api repos/frantzvardman26-max/3D/git/refs -f ref=refs/heads/twin -f sha=$SHA >/dev/null && echo "twin branch made"; }
          gh api -X POST repos/frantzvardman26-max/ownit-app/actions/workflows/twin-deploy.yml/dispatches -f ref=main && echo "first twin build started"
