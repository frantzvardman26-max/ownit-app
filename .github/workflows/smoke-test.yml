name: Smoke test (install the published apps on a real Android emulator, open each, catch crashes)
on:
  workflow_run:
    workflows: ["F-Droid app library"]
    types: [completed]
  workflow_dispatch:
    inputs:
      api: {description: 'Android API level', required: false, default: '34'}
      profile: {description: 'Device to emulate (e.g. pixel_tablet); blank = phone', required: false, default: ''}
      only: {description: 'Only these apps (space separated vault names); blank = all', required: false, default: ''}
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Download the published APKs
        run: |
          mkdir apks && cd apks
          # Every app file comes from the private app vault (never a public link).
          for n in ${{ inputs.only || 'FreeLane Lovly Reclaim BayouBurger RexVoice SignalFire SafeToSpend SafePocket PureBeats CrownRush ClearCheck GiantsAndGuns CaveHunt MonkeyMoney BombsAndBullion VindieAds PostHub PalmDistribute OwnIt' }}; do
            npx --yes wrangler@4 r2 object get "fv-app-vault/build/$n.apk" --file "$n.apk" --remote >/dev/null 2>&1 || echo "::warning::no $n in the vault yet"; done
          [ -n "${{ inputs.only }}" ] || for n in FreeLane-store SignalFire-store LeadHunter-store LeadHunter; do npx --yes wrangler@4 r2 object get "fv-app-vault/store/$n.apk" --file "$n.apk" --remote >/dev/null 2>&1 || npx --yes wrangler@4 r2 object get "fv-app-vault/build/$n.apk" --file "$n.apk" --remote >/dev/null 2>&1 || true; done
          find . -name '*.apk' -size 0 -delete   # a file that couldn't be fetched leaves an empty one: never test those
          ls -la
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api || '34' }}
          arch: x86_64
          target: google_apis
          profile: ${{ inputs.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            bash .github/smoke.sh
            grep -q 'NOT RUNNING' smoke.out && exit 1 || true
