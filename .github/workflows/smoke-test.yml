name: Smoke test (install the published apps on a real Android emulator, open each, catch crashes)
on:
  workflow_run:
    workflows: ["F-Droid app library"]
    types: [completed]
  workflow_dispatch:
    inputs:
      api: {description: 'Android API level', required: false, default: '34'}
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Download the published APKs
        run: |
          mkdir apks && cd apks
          for t in freelane lovly reclaim rexvoice signalfire safetospend safepocket purebeats crownrush clearcheck; do gh release download $t -R "$GITHUB_REPOSITORY" -p '*.apk' || true; done
          gh release download v202 -R "$GITHUB_REPOSITORY" -p 'OwnIt.apk' || true
          gh release download store-files -R "$GITHUB_REPOSITORY" -p 'FreeLane-store.apk' -p 'SignalFire-store.apk' -p 'LeadHunter-store.apk' || true
          ls -la
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api || '34' }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            bash .github/smoke.sh
            grep -q 'NOT RUNNING' smoke.out && exit 1 || true
