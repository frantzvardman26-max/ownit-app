name: Timestamp a hash on Bitcoin (OpenTimestamps; only the hash leaves, never the record)
on:
  workflow_dispatch:
    inputs:
      hash: {description: 'SHA-256 hex (64 characters)', required: true}
permissions: { contents: read }
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - env: { H: "${{ inputs.hash }}" }
        run: |
          [[ "$H" =~ ^[0-9a-f]{64}$ ]] || { echo "not a sha256"; exit 1; }
          pip install -q opentimestamps-client
          printf '%s\n' "$H" > hash.txt
          ots stamp hash.txt
          echo "OTS:$(base64 -w0 hash.txt.ots)"
