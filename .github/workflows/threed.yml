name: Build 3D (private, owner only)
on:
  workflow_dispatch:
# 3D is the trust's private assistant. The finished app goes only to the private app vault (Free Lane shows it to the
# owner alone); nothing is published here. The code is checked out from the private repo with BUILD_TOKEN.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: frantzvardman26-max/3D
          token: ${{ secrets.BUILD_TOKEN }}
          submodules: false
      - name: Build number
        run: echo "APP_BUILD_NUMBER=$((200 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Keep Gradle between builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-3d-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/app/build.gradle.kts', 'android/lib/build.gradle.kts') }}-r1
          restore-keys: gradle-
      - name: Server brain tests (the trust's own assistant, with a fake model)
        run: python3 server3d/tests/test_threed.py
      - name: Pack the engine's C++ library (libc++_shared.so from Android NDK r29 or newer, matching the engine's compiler)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"; NDK=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)
          MAJOR=$(basename "${NDK:-0}" | cut -d. -f1)
          if [ -z "$NDK" ] || [ "${MAJOR:-0}" -lt 29 ]; then
            V=$("$SDK/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null | grep -oE "ndk;(29|3[0-9])\.[0-9.]+" | sort -t';' -k2 -V | tail -1)
            echo "installing $V"; yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "$V" > /dev/null; NDK="$SDK/ndk/${V#ndk;}"
          fi
          echo "NDK $(basename "$NDK")"
          L=$(find "$NDK" -path "*aarch64-linux-android/libc++_shared.so" | head -1); [ -f "$L" ] || { echo "::error::libc++_shared.so not found in $NDK"; exit 1; }
          cp "$L" android/lib/src/main/jniLibs/arm64-v8a/ && ls -la android/lib/src/main/jniLibs/arm64-v8a/
      - name: Build 3D
        working-directory: android
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties || true
          chmod +x gradlew
          for try in 1 2 3; do
            if ./gradlew :app:assembleDebug --no-daemon; then break; fi
            if [ $try = 3 ]; then exit 1; fi
            echo "Build attempt $try failed, waiting and trying again..."; sleep 45
          done
          cp app/build/outputs/apk/debug/app-debug.apk ../ThreeD.apk && ls -la ../ThreeD.apk
          # 3D must open: the engine's native-method classes keep their names after shrinking, and the engine library is inside
          M=app/build/outputs/mapping/debug/mapping.txt
          if [ -f "$M" ]; then grep -q "^com.arm.aichat.internal.InferenceEngineImpl -> com.arm.aichat.internal.InferenceEngineImpl:" "$M" && echo "engine classes kept" || { echo "::error::Shrinking renamed the engine's native class: 3D would close on start"; exit 1; }; fi
          unzip -l ../ThreeD.apk | grep -E "lib/arm64-v8a/.*\.so" | head -5; unzip -l ../ThreeD.apk | grep -qE "lib/arm64-v8a/.*\.so" || { echo "::error::No engine library in the app"; exit 1; }
          # every library the engine needs is either part of Android or packed in the app (a missing one closed 3D on start)
          T=$(mktemp -d); unzip -q -o ../ThreeD.apk 'lib/arm64-v8a/*' -d "$T"
          for so in "$T"/lib/arm64-v8a/*.so; do for need in $(readelf -d "$so" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p'); do
            case "$need" in libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so|libEGL.so|libGLESv2.so|libGLESv3.so|libvulkan.so|libjnigraphics.so|libmediandk.so|libOpenSLES.so|libnativewindow.so|libsync.so|libbinder_ndk.so) ;;
              *) [ -f "$T/lib/arm64-v8a/$need" ] || { echo "::error::$(basename "$so") needs $need, which is not in the app"; exit 1; } ;; esac; done; done
          echo "every engine library dependency is present"
      - name: Save to the private app vault (never published)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 r2 object put "fv-app-vault/build/ThreeD.apk" --file ThreeD.apk --remote >/dev/null 2>&1 && echo "Saved to the private app vault" || { echo "::error::Could not save to the private app vault"; exit 1; }
