name: Build 3D (private, owner only)
on:
  workflow_dispatch:
# 3D is the trust's private assistant. The finished app goes only to the private app vault (Free Lane shows it to the
# owner alone); nothing is published here. The code is checked out from the private repo with BUILD_TOKEN.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: frantzvardman26-max/3D
          token: ${{ secrets.BUILD_TOKEN }}
          submodules: false
      - name: Build number
        run: echo "APP_BUILD_NUMBER=$((200 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Keep Gradle between builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-3d-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/app/build.gradle.kts', 'android/lib/build.gradle.kts') }}-r1
          restore-keys: gradle-
      - name: Server brain tests (the trust's own assistant, with a fake model)
        run: python3 server3d/tests/test_threed.py
      - name: Build 3D
        working-directory: android
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties || true
          chmod +x gradlew
          for try in 1 2 3; do
            if ./gradlew :app:assembleDebug --no-daemon; then break; fi
            if [ $try = 3 ]; then exit 1; fi
            echo "Build attempt $try failed, waiting and trying again..."; sleep 45
          done
          cp app/build/outputs/apk/debug/app-debug.apk ../ThreeD.apk && ls -la ../ThreeD.apk
      - name: Save to the private app vault (never published)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 r2 object put "fv-app-vault/build/ThreeD.apk" --file ThreeD.apk --remote >/dev/null 2>&1 && echo "Saved to the private app vault" || { echo "::error::Could not save to the private app vault"; exit 1; }
