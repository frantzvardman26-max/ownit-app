name: Verify shop products
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Also rebuild and test every source-code package"
        type: boolean
        default: false
# Built here, in the public download repo, because GitHub Actions is free for public repositories.
# The code is checked out from the private repo with BUILD_TOKEN; only the finished app is published.
permissions:
  contents: read
jobs:
  templates:
    if: ${{ inputs.packages }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [SafeToSpend-Source, LeadHunter-Source, SafePocket-Source, CrownRush-Source, PureBeats-Source, SignalFire-Source, ClearCheck-Source]
    steps:
      - uses: actions/checkout@v5
        with:
          repository: frantzvardman26-max/3D   # the private code; this public repo only runs the build (free minutes)
          token: ${{ secrets.BUILD_TOKEN }}
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Package fresh from the app code
        run: python3 shop/tools/build_templates.py
      - name: Build the package exactly as a buyer would
        run: |
          mkdir -p "$RUNNER_TEMP/buyer" && cd "$RUNNER_TEMP/buyer"
          unzip -q "$GITHUB_WORKSPACE/shop/products/${{ matrix.pkg }}.zip"
          cd "${{ matrix.pkg }}" && chmod +x gradlew
          # Why: buyers get the tests too, so they must pass in the exact package that is sold.
          if [ "${{ matrix.pkg }}" != "LeadHunter-Source" ]; then ./gradlew :app:testDebugUnitTest --no-daemon; fi
          ./gradlew :app:assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/
  deploy:
    needs: templates
    if: ${{ !cancelled() && needs.templates.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: frantzvardman26-max/3D   # the private code; this public repo only runs the build (free minutes)
          token: ${{ secrets.BUILD_TOKEN }}
      - name: Guard - every script parses and every game menu opens without a crash
        run: |
          node ci/helpers/jscheck.js
          npm i --no-save --silent playwright@1.63.0 && npx playwright install --with-deps chromium > /dev/null
          node ci/helpers/gamesmoke.js
          node ci/helpers/screencheck.js   # the opening on 13 screen sizes (phones, tablets, desktop): nothing cut off, stacked or overlapping, or no build
      - name: Install image tools (thumbnails, icons, press kit)
        run: pip install --quiet pillow pypdf && (fc-list | grep -q DejaVuSerif-Bold || sudo apt-get install -y -qq fonts-dejavu-core) && (which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg))
      - name: Build the shop (site + products packed into the download function)
        run: python3 shop/tools/build_templates.py && python3 shop/tools/stamp_owner.py shop/site shop/products && python3 shop/tools/build_site.py && python3 shop/tools/no_hire_check.py
      - name: Publish to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::warning::Cloudflare secrets not added yet, so the shop isn't published."; exit 0; fi
          cd shop/dist
          npx --yes wrangler@3 pages project list | grep -q frantz-vardman-shop || npx --yes wrangler@3 pages project create frantz-vardman-shop --production-branch main
          bash ../tools/connect_download_log.sh || echo "::warning::Download log not connected (see step output). Downloads still work."
          bash ../tools/connect_app_vault.sh frantz-vardman-shop || echo "::warning::App vault not connected (see step output). Downloads fall back to the public copies."
          npx --yes wrangler@3 pages deploy . --project-name frantz-vardman-shop --branch main --commit-dirty=true
      - name: Tell search engines about new pages (IndexNow, no account)
        if: success()
        run: |
          python3 - "shop/dist" "shop.frantzmichaelsthilairevardman.com" <<'PY'
          import json, re, sys, glob, os, urllib.request
          dist, host = sys.argv[1], sys.argv[2]
          keys = [os.path.basename(f)[:-4] for f in glob.glob(dist + '/*.txt') if re.fullmatch(r'[0-9a-f]{32}', os.path.basename(f)[:-4])]
          if not keys: print('no IndexNow key file'); sys.exit(0)
          urls = re.findall(r'<loc>([^<]+)</loc>', open(dist + '/sitemap.xml').read())[:10000]
          body = json.dumps({"host": host, "key": keys[0], "keyLocation": f"https://{host}/{keys[0]}.txt", "urlList": urls}).encode()
          try:
              r = urllib.request.urlopen(urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"}), timeout=30)
              print("IndexNow:", r.status, len(urls), "pages")
          except Exception as e: print("IndexNow not accepted (fine, retried next deploy):", e)
          PY
