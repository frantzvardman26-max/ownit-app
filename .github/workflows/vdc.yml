name: Build Vindie Dungeon Crawler
on:
  workflow_dispatch:
# Built here because GitHub Actions is free for public repositories. The code comes from the private repo.
# Not published anywhere public: the finished app goes only to the private app vault (owner download, not in beta yet).
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: frantzvardman26-max/3D
          token: ${{ secrets.BUILD_TOKEN }}
      - name: Guard - copy the web game into the app, then every script must parse and every menu must open without a crash
        run: |
          python3 shop/tools/sync_games.py vdc
          node ci/helpers/jscheck.js
          npm i --no-save --silent playwright@1.63.0 && npx playwright install --with-deps chromium > /dev/null
          node ci/helpers/gamesmoke.js vdc
          node ci/helpers/screencheck.js vdc   # the opening on 13 screen sizes (phones, tablets, desktop): nothing cut off, stacked or overlapping, or no build
      - name: Build number
        run: echo "APP_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Keep Gradle between builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
            ~/.m2/repository/org/robolectric
          key: gradle-vdc-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/vdc/build.gradle.kts') }}-r1
          restore-keys: gradle-
      - name: Build Vindie Dungeon Crawler
        working-directory: android
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties || true
          chmod +x gradlew
          for try in 1 2 3 4; do
            if ./gradlew :vdc:assembleDebug --no-daemon; then break; fi
            if [ $try = 4 ]; then exit 1; fi
            echo "Build attempt $try failed, waiting and trying again..."; sleep 45
          done
          cp vdc/build/outputs/apk/debug/vdc-debug.apk ../VindieDungeonCrawler.apk
          ls -la ../VindieDungeonCrawler.apk
      - name: Tests (simulated phone)
        working-directory: android
        run: for i in 1 2 3; do ./gradlew :vdc:testDebugUnitTest --no-daemon && exit 0; echo "Tests could not run (often a download limit); waiting and trying again"; sleep 90; done; exit 1
      - name: Privacy check (internet is only for the update check; no other sensitive permission)
        run: |
          # Why: the privacy policy says the only internet use is asking the shop for the newest version. This fails the build if anything more is ever added.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for A in VindieDungeonCrawler.apk; do [ -f "$A" ] || continue; PERMS=$("$BT/aapt2" dump permissions $A); echo "$A: $PERMS"
            if echo "$PERMS" | grep -Eq "LOCATION|CONTACTS|CAMERA|RECORD_AUDIO|SMS|CALL_LOG|READ_PHONE|GET_ACCOUNTS|READ_EXTERNAL|READ_MEDIA|BLUETOOTH_SCAN|BODY_SENSORS"; then echo "::error::A sensitive permission was found in $A"; exit 1; fi
          done
          echo "OK: only the update check goes online"
      - name: Save to the private app vault (owner download only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put "fv-app-vault/build/VindieDungeonCrawler.apk" --file VindieDungeonCrawler.apk --remote >/dev/null 2>&1 && echo "Saved to the private app vault" || { echo "::error::Could not save to the private app vault"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); VC=$("$BT/aapt2" dump badging VindieDungeonCrawler.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          [ -n "$VC" ] && echo "{\"v\":$VC}" > VindieDungeonCrawler.json && npx --yes wrangler@4 r2 object put "fv-app-vault/build/VindieDungeonCrawler.json" --file VindieDungeonCrawler.json --content-type application/json --remote >/dev/null 2>&1 && echo "In-app updates now offer build $VC" || echo "::warning::Could not publish the version for in-app updates"
          rm -f VindieDungeonCrawler.apk
