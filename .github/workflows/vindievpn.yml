name: Build Vindie VPN
on:
  workflow_dispatch:
# Built here (public repo = free build minutes); the code comes from the private repo. The finished app goes to the
# private app vault, plus a 1-day build copy so the owner can grab it.
permissions:
  contents: read
concurrency:
  group: vindievpn
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: frantzvardman26-max/3D
          token: ${{ secrets.BUILD_TOKEN }}
      - name: Build number
        run: echo "APP_BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Keep Gradle between builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
            ~/.m2/repository/org/robolectric
          key: gradle-vv-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/vindievpn/build.gradle.kts') }}-r1
          restore-keys: gradle-
      - name: Control plane tests (accounts, devices, payments, gateway allow-list)
        run: python3 vpn/tests/test_control.py
      - name: Build Vindie VPN
        working-directory: android
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties || true
          chmod +x gradlew
          for try in 1 2 3 4; do
            if ./gradlew :vindievpn:assembleDebug --no-daemon; then break; fi
            if [ $try = 4 ]; then exit 1; fi
            echo "Build attempt $try failed, trying again..."; sleep 45
          done
          cp vindievpn/build/outputs/apk/debug/vindievpn-debug.apk ../VindieVPN.apk
          ls -la ../VindieVPN.apk
      - name: Save to the private app vault
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Not saved to the vault: the Vindie VPN in Free Lane comes from vindievpn-app.yml, which carries the signed server update"
