name: Broken link and button check (every public page; script kept in the private repo)
on:
  workflow_dispatch:
    inputs:
      urls: {description: 'Start URLs, space separated', required: true}
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fetch the checker from the private repo
        env: { GH_TOKEN: "${{ secrets.BUILD_TOKEN }}" }
        run: gh api "repos/frantzvardman26-max/3D/contents/ci/helpers/linkcheck.py" -q .content | base64 -d > linkcheck.py
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q playwright requests && python -m playwright install --with-deps chromium >/dev/null
      - env: { URLS: "${{ inputs.urls }}" }
        run: python linkcheck.py $URLS
