name: Store screenshots (screenshot bot, weekly)
# Plays every web game in a phone-sized browser, frames the shots (shop/tools/screenshot_bot), commits them to the private repo
# when they changed, then rebuilds the Free Lane catalog so the store shows them. Runs Sundays, or by hand (optionally one app: ONLY=vdc|monkey).
on:
  schedule: [{cron: '17 19 * * 0'}]
  workflow_dispatch:
    inputs:
      only: {description: 'vdc, monkey or web (empty = everything)', required: false, default: ''}
permissions: {contents: read}
jobs:
  shots:
    runs-on: ubuntu-latest
    env: {GH_TOKEN: '${{ secrets.BUILD_TOKEN }}', ONLY: '${{ inputs.only }}'}
    steps:
      - run: |
          set -e
          git config --global user.name "Frantz Vardman"; git config --global user.email "frantzvardman26-max@users.noreply.github.com"
          git clone -q --depth 50 "https://x-access-token:${GH_TOKEN}@github.com/frantzvardman26-max/3D.git" priv
          cd priv/shop/tools/screenshot_bot && npm init -y >/dev/null && npm i -s playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          pip install -q pillow
          (cd ../../site && python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          mkdir -p raw && OUT=raw node capture.js
          case "$ONLY" in
            "") python3 frame.py raw ../../screens ;;
            web) for k in com.bayouburgerllc.app com.frantzvardman.palm com.frantzvardman.vindie com.frantzvardman.vindienews; do python3 frame.py raw ../../screens $k; done ;;
            *) python3 frame.py raw ../../screens "com.frantzvardman.$ONLY" ;;
          esac
          mkdir -p ../../assets-src/raw-shots && cp raw/*.png ../../assets-src/raw-shots/   # the unframed captures, kept for checking captions
          rm -rf node_modules package.json package-lock.json raw
          cd ../../.. && git add shop/screens shop/assets-src/raw-shots
          git -c user.name="Frantz Vardman" -c user.email="frantzvardman26-max@users.noreply.github.com" commit -q -m "Store screenshots refreshed by the screenshot bot" || { echo "no changes"; exit 0; }
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && { echo pushed; break; }; [ $i = 4 ] && { echo "::error::couldn't save the screenshots"; exit 1; }; sleep 5; done   # someone else may have pushed meanwhile
          gh api -X POST repos/frantzvardman26-max/ownit-app/actions/workflows/fdroid-repo.yml/dispatches -f ref=main && echo "catalog rebuild started"
