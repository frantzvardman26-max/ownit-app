name: Twin promote (copy a fully tested twin to the live shop)
on:
  workflow_dispatch:
    inputs:
      sha: {description: 'Twin commit that passed', required: true}
permissions: {contents: read, actions: write}
jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with: {repository: frantzvardman26-max/3D, token: "${{ secrets.BUILD_TOKEN }}", ref: main, fetch-depth: 0}
      - name: Check the run again, then merge twin into live
        run: |
          set -e
          K=$(npx --yes wrangler@3 d1 execute shop-downloads --remote --json --command "SELECT value FROM owner_secrets WHERE name='twin_key'" 2>/dev/null | jq -r '.[0].results[0].value'); echo "::add-mask::$K"
          LAST=$(curl -sS https://frantz-twin.pages.dev/api/twin -H "Authorization: Bearer $K" | jq -c '.runs[0]')
          [ "$(echo "$LAST" | jq -r .status)" = passed ] && [ "$(echo "$LAST" | jq -r .failed)" = 0 ] && [ "$(echo "$LAST" | jq -r .sha)" = "${{ inputs.sha }}" ] || { echo "::error::latest twin run is not a clean pass of that commit"; exit 1; }
          git fetch origin twin && [ "$(git rev-parse origin/twin)" = "${{ inputs.sha }}" ] || { echo "::error::the twin changed after it was tested; test again"; exit 1; }
          git -c user.name="Frantz Vardman" -c user.email="frantzvardman26-max@users.noreply.github.com" merge --no-edit origin/twin
          git push origin HEAD:main && echo "merged into live"
          gh api -X POST repos/frantzvardman26-max/ownit-app/actions/workflows/shop-verify.yml/dispatches -f ref=main && echo "live shop deploying"
