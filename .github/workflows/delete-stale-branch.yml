name: Delete the old beta-labels-paused branch (one-time)
# Frantz asked for this leftover branch in the private repo to be removed. Its backup files are on the "vault" branch
# and its beta-label change is already on main. Only this exact branch name can be deleted here.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete refs/heads/beta-labels-paused in the private repo
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          set -e
          if gh api repos/frantzvardman26-max/3D/git/refs/heads/beta-labels-paused >/dev/null 2>&1; then
            gh api -X DELETE repos/frantzvardman26-max/3D/git/refs/heads/beta-labels-paused
            echo "Deleted beta-labels-paused."
          else
            echo "Already gone."
          fi
