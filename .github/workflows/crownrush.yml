name: Build Bombs & Bullion
on:
  workflow_dispatch:
    inputs:
      play:
        description: "Also build the Google Play bundle (.aab)"
        type: boolean
        default: false
# Built here, in the public download repo, because GitHub Actions is free for public repositories.
# The code is checked out from the private repo with BUILD_TOKEN; only the finished app is published.
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: frantzvardman26-max/3D   # the private code; this public repo only runs the build (free minutes)
          token: ${{ secrets.BUILD_TOKEN }}
      - name: Guard - copy the web game into the app, then every script must parse and every menu must open without a crash
        run: |
          python3 shop/tools/sync_games.py crownrush
          node ci/helpers/jscheck.js
          npm i --no-save --silent playwright@1.63.0 && npx playwright install --with-deps chromium > /dev/null
          node ci/helpers/gamesmoke.js play
          node ci/helpers/screencheck.js play   # the opening on 13 screen sizes (phones, tablets, desktop): nothing cut off, stacked or overlapping, or no build
      - name: Build number (continues from the old private builds so phones accept the update)
        run: echo "APP_BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Keep Gradle between builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
            ~/.m2/repository/org/robolectric
          key: gradle-cr-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/crownrush/build.gradle.kts') }}-r1
          restore-keys: gradle-
      - name: Build Bombs & Bullion
        working-directory: android
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties || true
          chmod +x gradlew
          for try in 1 2 3 4; do
            if ./gradlew :crownrush:assembleDebug --no-daemon; then break; fi
            if [ $try = 4 ]; then exit 1; fi
            echo "Build attempt $try failed, waiting and trying again..."
            sleep 45
          done
          cp crownrush/build/outputs/apk/debug/crownrush-debug.apk ../CrownRush.apk
          ls -la ../CrownRush.apk
      - name: Tests (screens on a simulated phone)
        working-directory: android
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew :crownrush:testDebugUnitTest --no-daemon && break; [ $i = 3 ] && exit 1; echo "Tests could not run (often a download limit); trying again in 90s"; sleep 90; done
      - name: Share screen-test screenshots for review (branch cr-screens)
        if: always()
        run: |
          D=android/crownrush/build/screens
          [ -d "$D" ] || { echo "No screenshots"; exit 0; }
          T=$(mktemp -d); cp "$D"/*.png "$T"/ 2>/dev/null || exit 0
          cd "$T" && git init -q && git checkout -q -b cr-screens && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "screens"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cr-screens || echo "::warning::Couldn't push screenshots"
      - name: Google Play bundle (.aab), signed with the Bombs & Bullion upload key
        if: inputs.play
        working-directory: android
        env:
          PW: ${{ secrets.OWNIT_RELEASE_PASSWORD }}
        run: |
          # Why: Google Play needs an upload key that stays the same for the life of the app; it's created once and kept encrypted.
          if [ -z "$PW" ]; then echo "::warning::No signing password secret, so no Play bundle"; exit 0; fi
          ENC=crownrush/signing/upload.jks.enc
          KS="$RUNNER_TEMP/upload.jks"
          if [ ! -f "$ENC" ]; then
            mkdir -p crownrush/signing
            keytool -genkeypair -keystore "$KS" -storepass:env PW -keypass:env PW -alias cr-upload -keyalg RSA -keysize 4096 \
              -validity 10000 -dname "CN=Bombs & Bullion, O=Frantz Vardman, C=US"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$KS" -out "$ENC" -pass env:PW
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ENC" && git commit -m "Bombs & Bullion: encrypted Play upload key [skip ci]" && git pull --rebase -q origin main && git push -q origin HEAD:main
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$ENC" -out "$KS" -pass env:PW
          fi
          ./gradlew :crownrush:bundleRelease --no-daemon
          AAB=crownrush/build/outputs/bundle/release/crownrush-release.aab
          zip -q -d "$AAB" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.MF' 2>/dev/null || true
          jarsigner -keystore "$KS" -storepass:env PW -keypass:env PW -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" cr-upload
          jarsigner -verify "$AAB" | tail -1
          cp "$AAB" ../CrownRush-GooglePlay.aab
          rm -f "$KS"
      - name: Privacy check (internet is only for the update check; no other sensitive permission)
        run: |
          # Why: the privacy policy says the only internet use is asking the shop for the newest version. This fails the build if anything more is ever added.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for A in CrownRush.apk; do [ -f "$A" ] || continue; PERMS=$("$BT/aapt2" dump permissions $A); echo "$A: $PERMS"
            if echo "$PERMS" | grep -Eq "LOCATION|CONTACTS|CAMERA|RECORD_AUDIO|SMS|CALL_LOG|READ_PHONE|GET_ACCOUNTS|READ_EXTERNAL|READ_MEDIA|BLUETOOTH_SCAN|BODY_SENSORS"; then echo "::error::A sensitive permission was found in $A"; exit 1; fi
          done
          echo "OK: only the update check goes online"
      - name: Publish the privacy policy page (public, on frantzvardman26-max/ownit-app)
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          # Why: Google Play requires a public privacy policy link for every app.
          if [ -z "$GH_TOKEN" ]; then echo "No publish token"; exit 0; fi
          REPO=frantzvardman26-max/ownit-app; F=CROWN_RUSH_PRIVACY.md
          SHA=$(gh api "repos/$REPO/contents/$F" --jq .sha 2>/dev/null || true); echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || SHA=""
          NEWB=$(base64 -w0 android/crownrush/docs/PRIVACY.md)
          OLDB=$(gh api "repos/$REPO/contents/$F" --jq .content 2>/dev/null | tr -d '\n' || true)
          if [ "$NEWB" != "$OLDB" ]; then gh api -X PUT "repos/$REPO/contents/$F" -f message="Bombs & Bullion privacy policy" -f content="$NEWB" ${SHA:+-f sha="$SHA"} >/dev/null && echo "Policy: https://github.com/$REPO/blob/main/$F" || echo "::warning::Couldn't publish the policy"; else echo "Policy unchanged"; fi
      - name: Public download page (frantzvardman26-max/ownit-app, tag "crownrush", never marked latest so Own It's updater is unaffected)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          # Why: a link anyone can open on their phone to install the app before it's on Google Play.
          if [ -z "$GH_TOKEN" ]; then echo "No publish token"; exit 0; fi
          REPO=frantzvardman26-max/ownit-app
          gh release delete crownrush -R "$REPO" -y --cleanup-tag || true
          for f in CrownRush.apk $(ls *-GooglePlay.aab 2>/dev/null); do [ -f "$f" ] && npx --yes wrangler@4 r2 object put "fv-app-vault/build/$(basename "$f")" --file "$f" --remote >/dev/null 2>&1 && echo "Saved to the private app vault: $(basename "$f")" || echo "::warning::Could not save $f to the private app vault"; done
      - name: Version for in-app updates (the games ask /api/app-version on launch)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); VC=$("$BT/aapt2" dump badging CrownRush.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          [ -n "$VC" ] && echo "{\"v\":$VC}" > CrownRush.json && npx --yes wrangler@4 r2 object put "fv-app-vault/build/CrownRush.json" --file CrownRush.json --content-type application/json --remote >/dev/null 2>&1 && echo "In-app updates now offer build $VC" || echo "::warning::Could not publish the version for in-app updates"
      - name: Refresh the F-Droid library so phones see this update
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fdroid-repo.yml -R "$GITHUB_REPOSITORY" || echo "::warning::Couldn't start the F-Droid refresh"
