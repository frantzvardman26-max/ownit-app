name: Promo codes on (members' code works at every checkout)
# Turns on "allow promotion codes" for every live shop payment link, so members can use their first-order code.
# Same one-time token pattern as Reprice: token on, deploy, run in chunks, token off, deploy. Public log shows counts only.
on: workflow_dispatch
permissions: {contents: read, actions: write}
jobs:
  promo:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
      R: frantzvardman26-max/ownit-app
    steps:
      - name: Run
        run: |
          set -e
          api() { curl -sS -H "Authorization: Bearer $CF" -H 'Content-Type: application/json' "$@"; }
          B=https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/frantz-vardman-shop
          deploy() { gh api -X POST repos/$R/actions/workflows/shop-verify.yml/dispatches -f ref=main; sleep 20
            id=$(gh api "repos/$R/actions/workflows/shop-verify.yml/runs?per_page=1" -q '.workflow_runs[0].id'); gh run watch $id -R $R --exit-status > /dev/null; echo "deployed $id"; }
          gh api repos/frantzvardman26-max/3D/contents/shop/shop.config.json -q .download_url > u.txt
          curl -sS -H "Authorization: Bearer $GH_TOKEN" "$(cat u.txt)" | jq -c '[.products[] | select(.hold|not) | (.paymentLinkId // empty), ((.book // [])[] | .linkId // empty)] | map(select(test("^plink_")))' > ids.json
          echo "links: $(jq length ids.json)"
          TOK=$(openssl rand -hex 24); echo "::add-mask::$TOK"
          api -X PATCH $B -d "$(jq -n --arg t "$TOK" '{deployment_configs:{production:{env_vars:{REPRICE_TOKEN:{type:"secret_text",value:$t}}}}}')" | jq -r '"token set: \(.success)"'
          deploy
          n=$(jq length ids.json); on=0; al=0; bad=0
          for ((i=0; i<n; i+=20)); do
            r=$(curl -sS -X POST https://shop.frantzmichaelsthilairevardman.com/api/reprice -H "X-Reprice-Token: $TOK" -H 'Content-Type: application/json' -d "$(jq -c --argjson i $i '{promoOn: .[$i:$i+20]}' ids.json)" || echo '[]')
            on=$((on + $(echo "$r" | jq '[.[]|select(.on)]|length'))); al=$((al + $(echo "$r" | jq '[.[]|select(.already)]|length'))); bad=$((bad + $(echo "$r" | jq '[.[]|select(.error)]|length')))
          done
          echo "turned on: $on · already on: $al · errors: $bad"
          api -X PATCH $B -d '{"deployment_configs":{"production":{"env_vars":{"REPRICE_TOKEN":null}}}}' | jq -r '"token removed: \(.success)"'
          deploy
