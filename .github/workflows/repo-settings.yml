name: Repo descriptions and topics
# Why: sets the public description, website and topics of Frantz's public repos (the session proxy can't change repo settings).
on: workflow_dispatch
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          set_repo() {   # repo, description, homepage, topics...
            r="$1"; d="$2"; h="$3"; shift 3
            gh api -X PATCH "repos/frantzvardman26-max/$r" -f description="$d" -f homepage="$h" -F has_wiki=false -F has_projects=false > /dev/null && echo "$r: description set" || echo "::warning::$r description not set"
            args=(); for t in "$@"; do args+=(-f "names[]=$t"); done
            gh api -X PUT "repos/frantzvardman26-max/$r/topics" "${args[@]}" > /dev/null && echo "$r: topics set" || echo "::warning::$r topics not set"
          }
          set_repo ownit-app "Android apps and games by Frantz Vardman: CI builds, signed releases, the Free Lane store and an F-Droid library. Private by default." \
            "https://shop.frantzmichaelsthilairevardman.com/" android android-apps kotlin github-actions ci-cd fdroid privacy offline-first indie-games app-store
          set_repo leadhunter-app "Lead Hunter: homeowner leads for roofing and window reps from public county records and hail reports. Android, English and Spanish." \
            "https://shop.frantzmichaelsthilairevardman.com/apps/leadhunter" android kotlin sales-tools lead-generation roofing hail offline-first
          set_repo frantzvardman26-max "Frantz Vardman: Android apps and games, a self-hosted VPN, Vindie News and the Frantz Vardman Shop" \
            "https://shop.frantzmichaelsthilairevardman.com/" profile android indie-games privacy
          set_repo frantzvardman26-max.github.io "Frantz Vardman's website: apps, games, asset protection and AceThe_Kid beats" \
            "https://frantzvardman26-max.github.io/" website portfolio android indie-games
