name: Run a private SQL file on the shop database
# Runs shop/tools/sql/<file> from the private repo against the live shop database. The log shows only whether it worked.
on:
  workflow_dispatch:
    inputs:
      file: {description: 'File name in shop/tools/sql/', required: true}
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
      F: ${{ inputs.file }}
    steps:
      - run: |
          case "$F" in *[!A-Za-z0-9._-]*) echo "bad name"; exit 1;; esac
          gh api "repos/frantzvardman26-max/3D/contents/shop/tools/sql/$F" -q .content | base64 -d > run.sql
          npx --yes wrangler@3 d1 execute shop-downloads --remote --file run.sql > out.txt 2>&1 && echo "ran $(grep -c ';' run.sql) statements" || { echo "failed"; grep -iE "error" out.txt | head -3 | cut -c1-200; exit 1; }
