name: Build Rex Voice
on:
  workflow_dispatch:
    inputs:
      play:
        description: "Also build the Google Play bundle (.aab)"
        type: boolean
        default: false
# Built here, in the public download repo, because GitHub Actions is free for public repositories.
# The code is checked out from the private repo with BUILD_TOKEN; only the finished app is published.
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: frantzvardman26-max/3D   # the private code; this public repo only runs the build (free minutes)
          token: ${{ secrets.BUILD_TOKEN }}
      - name: Build number (continues from the old private builds so phones accept the update)
        run: echo "APP_BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Keep Gradle between builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-rv-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/rexvoice/build.gradle.kts') }}
          restore-keys: gradle-
      - name: On-device voice engine (sherpa-onnx native code + Pocket TTS model)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Why: Rex Voice clones voices itself, on the phone, with no outside service. The model (Kyutai Pocket TTS,
          # CC BY 4.0, int8 build published by sherpa-onnx) and the engine (sherpa-onnx, Apache-2.0) are too big for git,
          # so each build downloads the pinned versions. SHERPA must match the vendored Tts.kt.
          set -e
          SHERPA=1.13.8; MODEL=sherpa-onnx-pocket-tts-int8-2026-01-26
          R=android/rexvoice/src/main; T=$(mktemp -d)
          NAME=$(gh api "repos/k2-fsa/sherpa-onnx/releases/tags/v$SHERPA" -q '.assets[].name' | grep -E 'android\.tar\.bz2$' | grep -viE 'static|rknn|qnn|ascend|wear' | head -1)
          echo "engine archive: $NAME"; [ -n "$NAME" ] || { gh api "repos/k2-fsa/sherpa-onnx/releases/tags/v$SHERPA" -q '.assets[].name' | grep -i android; exit 1; }
          curl -fsSL --retry 4 -o "$T/libs.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$SHERPA/$NAME"
          tar xjf "$T/libs.tar.bz2" -C "$T"; mkdir -p "$R/jniLibs/arm64-v8a"; cp $(find "$T" -path '*arm64-v8a/*.so') "$R/jniLibs/arm64-v8a/"
          curl -fsSL --retry 4 -o "$T/model.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$MODEL.tar.bz2"
          tar xjf "$T/model.tar.bz2" -C "$T"; mkdir -p "$R/assets/pocket"
          for f in lm_flow.int8.onnx lm_main.int8.onnx encoder.onnx decoder.int8.onnx text_conditioner.onnx vocab.json token_scores.json; do cp "$(find "$T" -name "$f" | head -1)" "$R/assets/pocket/"; done
          ls -la "$R/jniLibs/arm64-v8a" "$R/assets/pocket"; du -sh "$R/assets/pocket" "$R/jniLibs"
      - name: Build Rex Voice
        working-directory: android
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties || true
          chmod +x gradlew
          for try in 1 2 3 4; do
            if ./gradlew :rexvoice:assembleDebug --no-daemon; then break; fi
            if [ $try = 4 ]; then exit 1; fi
            echo "Build attempt $try failed, waiting and trying again..."
            sleep 45
          done
          cp rexvoice/build/outputs/apk/debug/rexvoice-debug.apk ../RexVoice.apk
          ls -la ../RexVoice.apk
          unzip -l ../RexVoice.apk | grep -E 'pocket/|libsherpa' || { echo '::error::Voice model or engine missing from the APK'; exit 1; }
      - name: Tests (screens on a simulated phone)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :rexvoice:testDebugUnitTest --no-daemon
      - name: Share screen-test screenshots for review (branch rv-screens)
        if: always()
        run: |
          D=android/rexvoice/build/screens
          [ -d "$D" ] || { echo "No screenshots"; exit 0; }
          T=$(mktemp -d); cp "$D"/*.png "$D"/*.wav "$T"/ 2>/dev/null || true; ls "$T" | grep -q . || exit 0
          cd "$T" && git init -q && git checkout -q -b rv-screens && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "screens"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" rv-screens || echo "::warning::Couldn't push screenshots"
      - name: Google Play bundle (.aab), signed with the Rex Voice upload key
        if: inputs.play
        working-directory: android
        env:
          PW: ${{ secrets.OWNIT_RELEASE_PASSWORD }}
        run: |
          # Why: Google Play needs an upload key that stays the same for the life of the app; it's created once and kept encrypted.
          if [ -z "$PW" ]; then echo "::warning::No signing password secret, so no Play bundle"; exit 0; fi
          ENC=rexvoice/signing/upload.jks.enc
          KS="$RUNNER_TEMP/upload.jks"
          if [ ! -f "$ENC" ]; then
            mkdir -p rexvoice/signing
            keytool -genkeypair -keystore "$KS" -storepass:env PW -keypass:env PW -alias rv-upload -keyalg RSA -keysize 4096 \
              -validity 10000 -dname "CN=Rex Voice, O=Frantz Vardman, C=US"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$KS" -out "$ENC" -pass env:PW
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ENC" && git commit -m "Rex Voice: encrypted Play upload key [skip ci]" && git pull --rebase -q origin main && git push -q origin HEAD:main
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$ENC" -out "$KS" -pass env:PW
          fi
          ./gradlew :rexvoice:bundleRelease --no-daemon
          AAB=rexvoice/build/outputs/bundle/release/rexvoice-release.aab
          zip -q -d "$AAB" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.MF' 2>/dev/null || true
          jarsigner -keystore "$KS" -storepass:env PW -keypass:env PW -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" rv-upload
          jarsigner -verify "$AAB" | tail -1
          cp "$AAB" ../RexVoice-GooglePlay.aab
          rm -f "$KS"
      - name: Privacy check (the app must never get internet access)
        run: |
          # Why: the privacy policy promises no internet access; this fails the build if that promise is ever broken.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PERMS=$("$BT/aapt2" dump permissions RexVoice.apk); echo "$PERMS"
          if echo "$PERMS" | grep -q "android.permission.INTERNET"; then echo "::error::INTERNET permission found. Rex Voice promises no internet access."; exit 1; fi
          echo "OK: no internet permission"
      - name: Publish the privacy policy page (public, on frantzvardman26-max/ownit-app)
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          # Why: Google Play requires a public privacy policy link for every app.
          if [ -z "$GH_TOKEN" ]; then echo "No publish token"; exit 0; fi
          REPO=frantzvardman26-max/ownit-app; F=REX_VOICE_PRIVACY.md
          SHA=$(gh api "repos/$REPO/contents/$F" --jq .sha 2>/dev/null || true); echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || SHA=""
          NEWB=$(base64 -w0 android/rexvoice/docs/PRIVACY.md)
          OLDB=$(gh api "repos/$REPO/contents/$F" --jq .content 2>/dev/null | tr -d '\n' || true)
          if [ "$NEWB" != "$OLDB" ]; then gh api -X PUT "repos/$REPO/contents/$F" -f message="Rex Voice privacy policy" -f content="$NEWB" ${SHA:+-f sha="$SHA"} >/dev/null && echo "Policy: https://github.com/$REPO/blob/main/$F" || echo "::warning::Couldn't publish the policy"; else echo "Policy unchanged"; fi
      - name: Public download page (frantzvardman26-max/ownit-app, tag "rexvoice", never marked latest so Own It's updater is unaffected)
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          # Why: a link anyone can open on their phone to install the app before it's on Google Play.
          if [ -z "$GH_TOKEN" ]; then echo "No publish token"; exit 0; fi
          REPO=frantzvardman26-max/ownit-app
          gh release delete rexvoice -R "$REPO" -y --cleanup-tag || true
          gh release create rexvoice RexVoice.apk $(ls *-GooglePlay.aab 2>/dev/null) -R "$REPO" --latest=false \
            --title "Rex Voice" --notes "Rex Voice: record your voice, keep it in a private vault with spoken consent, and turn scripts into narration. Offline, no internet permission. Build $APP_BUILD_NUMBER." \
            && echo "Public download: https://github.com/$REPO/releases/download/rexvoice/RexVoice.apk" || echo "::warning::Couldn't publish the public download"
      - name: Refresh the F-Droid library so phones see this update
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fdroid-repo.yml -R "$GITHUB_REPOSITORY" || echo "::warning::Couldn't start the F-Droid refresh"
