name: Build Giants & Guns
on:
  workflow_dispatch:
# Built here, in the public download repo, because GitHub Actions is free for public repositories.
# The code is checked out from the private repo with BUILD_TOKEN; only the finished app is published.
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: frantzvardman26-max/3D   # the private code; this public repo only runs the build (free minutes)
          token: ${{ secrets.BUILD_TOKEN }}
      - name: Guard - copy the web game into the app, then every script must parse and every menu must open without a crash
        run: |
          python3 shop/tools/sync_games.py giants
          node ci/helpers/jscheck.js
          npm i --no-save --silent playwright@1.63.0 && npx playwright install --with-deps chromium > /dev/null
          node ci/helpers/gamesmoke.js giants
          node ci/helpers/screencheck.js giants   # the opening on 13 screen sizes (phones, tablets, desktop): nothing cut off, stacked or overlapping, or no build
      - name: Build number (continues from the old private builds so phones accept the update)
        run: echo "APP_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Keep Gradle between builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
            ~/.m2/repository/org/robolectric
          key: gradle-gg-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/giants/build.gradle.kts') }}-r1
          restore-keys: gradle-
      - name: Build Giants & Guns (Free + Gold)
        working-directory: android
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties || true
          chmod +x gradlew
          for try in 1 2 3 4; do
            if ./gradlew :giants:assembleFreeDebug :giants:assembleGoldDebug --no-daemon; then break; fi
            if [ $try = 4 ]; then exit 1; fi
            echo "Build attempt $try failed, waiting and trying again..."
            sleep 45
          done
          cp giants/build/outputs/apk/free/debug/giants-free-debug.apk ../GiantsAndGuns.apk
          cp giants/build/outputs/apk/gold/debug/giants-gold-debug.apk ../GiantsGold.apk
          ls -la ../GiantsAndGuns.apk ../GiantsGold.apk
      - name: Tests (screens on a simulated phone)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :giants:testFreeDebugUnitTest --no-daemon
      - name: Share screen-test screenshots for review (branch gg-screens)
        if: always()
        run: |
          D=android/giants/build/screens
          [ -d "$D" ] || { echo "No screenshots"; exit 0; }
          T=$(mktemp -d); cp "$D"/*.png "$T"/ 2>/dev/null || exit 0
          cd "$T" && git init -q && git checkout -q -b gg-screens && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "screens"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gg-screens || echo "::warning::Couldn't push screenshots"
      - name: Privacy check (internet is only for the update check; no other sensitive permission)
        run: |
          # Why: the privacy policy says the only internet use is asking the shop for the newest version. This fails the build if anything more is ever added.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for A in GiantsAndGuns.apk GiantsGold.apk; do [ -f "$A" ] || continue; PERMS=$("$BT/aapt2" dump permissions $A); echo "$A: $PERMS"
            if echo "$PERMS" | grep -Eq "LOCATION|CONTACTS|CAMERA|RECORD_AUDIO|SMS|CALL_LOG|READ_PHONE|GET_ACCOUNTS|READ_EXTERNAL|READ_MEDIA|BLUETOOTH_SCAN|BODY_SENSORS"; then echo "::error::A sensitive permission was found in $A"; exit 1; fi
          done
          echo "OK: only the update check goes online"
      - name: Publish the privacy policy page (public, on frantzvardman26-max/ownit-app)
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          # Why: Google Play requires a public privacy policy link for every app.
          if [ -z "$GH_TOKEN" ]; then echo "No publish token"; exit 0; fi
          REPO=frantzvardman26-max/ownit-app; F=GIANTS_GUNS_PRIVACY.md
          SHA=$(gh api "repos/$REPO/contents/$F" --jq .sha 2>/dev/null || true); echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || SHA=""
          NEWB=$(base64 -w0 android/giants/docs/PRIVACY.md)
          OLDB=$(gh api "repos/$REPO/contents/$F" --jq .content 2>/dev/null | tr -d '\n' || true)
          if [ "$NEWB" != "$OLDB" ]; then gh api -X PUT "repos/$REPO/contents/$F" -f message="Giants & Guns privacy policy" -f content="$NEWB" ${SHA:+-f sha="$SHA"} >/dev/null && echo "Policy: https://github.com/$REPO/blob/main/$F" || echo "::warning::Couldn't publish the policy"; else echo "Policy unchanged"; fi
      - name: Public download page (frantzvardman26-max/ownit-app, tag "giants", never marked latest so Own It's updater is unaffected)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          # Why: a link anyone can open on their phone to install the app before it's on Google Play.
          if [ -z "$GH_TOKEN" ]; then echo "No publish token"; exit 0; fi
          REPO=frantzvardman26-max/ownit-app
          gh release delete giants -R "$REPO" -y --cleanup-tag || true
          for f in GiantsAndGuns.apk; do [ -f "$f" ] && npx --yes wrangler@4 r2 object put "fv-app-vault/build/$(basename "$f")" --file "$f" --remote >/dev/null 2>&1 && echo "Saved to the private app vault: $(basename "$f")" || echo "::warning::Could not save $f to the private app vault"; done
      - name: Version for in-app updates (the games ask /api/app-version on launch)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); VC=$("$BT/aapt2" dump badging GiantsAndGuns.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          [ -n "$VC" ] && echo "{\"v\":$VC}" > GiantsAndGuns.json && npx --yes wrangler@4 r2 object put "fv-app-vault/build/GiantsAndGuns.json" --file GiantsAndGuns.json --content-type application/json --remote >/dev/null 2>&1 && echo "In-app updates now offer build $VC" || echo "::warning::Could not publish the version for in-app updates"
      - name: Deliver the Gold Edition to the shop (private repo only; never published here)
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          # Why: Gold is the paid edition. It goes only into the private shop repo, where it's handed out after a confirmed purchase.
          if [ -z "$GH_TOKEN" ]; then echo "No token"; exit 0; fi
          REPO=frantzvardman26-max/3D; F=shop/products/GiantsGold.apk
          SHA=$(gh api "repos/$REPO/contents/$F" --jq .sha 2>/dev/null || true); echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || SHA=""
          base64 -w0 GiantsGold.apk > gold.b64
          jq -n --rawfile c gold.b64 --arg sha "$SHA" --arg m "Giants & Guns Gold build $APP_BUILD_NUMBER" '{message:$m,content:$c} + (if $sha=="" then {} else {sha:$sha} end)' > body.json
          gh api -X PUT "repos/$REPO/contents/$F" --input body.json > /dev/null && echo "Gold delivered to the shop" || { echo "::error::Couldn't deliver Gold"; exit 1; }
          rm -f gold.b64 body.json GiantsGold.apk
          gh workflow run shop-verify.yml -R "$GITHUB_REPOSITORY" || echo "::warning::Couldn't redeploy the shop"
      - name: Refresh the F-Droid library so phones see this update
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fdroid-repo.yml -R "$GITHUB_REPOSITORY" || echo "::warning::Couldn't start the F-Droid refresh"
