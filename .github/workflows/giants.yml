name: Build Giants & Guns (beta)
on:
  workflow_dispatch:
# Built here, in the public download repo, because GitHub Actions is free for public repositories.
# The code is checked out from the private repo with BUILD_TOKEN; only the finished app is published.
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: frantzvardman26-max/3D   # the private code; this public repo only runs the build (free minutes)
          token: ${{ secrets.BUILD_TOKEN }}
      - name: Build number (continues from the old private builds so phones accept the update)
        run: echo "APP_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Keep Gradle between builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-gg-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/giants/build.gradle.kts') }}
          restore-keys: gradle-
      - name: Build Giants & Guns (beta)
        working-directory: android
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties || true
          chmod +x gradlew
          for try in 1 2 3 4; do
            if ./gradlew :giants:assembleDebug --no-daemon; then break; fi
            if [ $try = 4 ]; then exit 1; fi
            echo "Build attempt $try failed, waiting and trying again..."
            sleep 45
          done
          cp giants/build/outputs/apk/debug/giants-debug.apk ../GiantsAndGuns.apk
          ls -la ../GiantsAndGuns.apk
      - name: Tests (screens on a simulated phone)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :giants:testDebugUnitTest --no-daemon
      - name: Share screen-test screenshots for review (branch gg-screens)
        if: always()
        run: |
          D=android/giants/build/screens
          [ -d "$D" ] || { echo "No screenshots"; exit 0; }
          T=$(mktemp -d); cp "$D"/*.png "$T"/ 2>/dev/null || exit 0
          cd "$T" && git init -q && git checkout -q -b gg-screens && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "screens"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gg-screens || echo "::warning::Couldn't push screenshots"
      - name: Privacy check (the app must never get internet access)
        run: |
          # Why: the privacy policy promises no internet access; this fails the build if that promise is ever broken.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PERMS=$("$BT/aapt2" dump permissions GiantsAndGuns.apk); echo "$PERMS"
          if echo "$PERMS" | grep -q "android.permission.INTERNET"; then echo "::error::INTERNET permission found. Giants & Guns promises no internet access."; exit 1; fi
          echo "OK: no internet permission"
      - name: Publish the privacy policy page (public, on frantzvardman26-max/ownit-app)
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          # Why: Google Play requires a public privacy policy link for every app.
          if [ -z "$GH_TOKEN" ]; then echo "No publish token"; exit 0; fi
          REPO=frantzvardman26-max/ownit-app; F=GIANTS_GUNS_PRIVACY.md
          SHA=$(gh api "repos/$REPO/contents/$F" --jq .sha 2>/dev/null || true); echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || SHA=""
          NEWB=$(base64 -w0 android/giants/docs/PRIVACY.md)
          OLDB=$(gh api "repos/$REPO/contents/$F" --jq .content 2>/dev/null | tr -d '\n' || true)
          if [ "$NEWB" != "$OLDB" ]; then gh api -X PUT "repos/$REPO/contents/$F" -f message="Giants & Guns privacy policy" -f content="$NEWB" ${SHA:+-f sha="$SHA"} >/dev/null && echo "Policy: https://github.com/$REPO/blob/main/$F" || echo "::warning::Couldn't publish the policy"; else echo "Policy unchanged"; fi
      - name: Public download page (frantzvardman26-max/ownit-app, tag "giants", never marked latest so Own It's updater is unaffected)
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          # Why: a link anyone can open on their phone to install the app before it's on Google Play.
          if [ -z "$GH_TOKEN" ]; then echo "No publish token"; exit 0; fi
          REPO=frantzvardman26-max/ownit-app
          gh release delete giants -R "$REPO" -y --cleanup-tag || true
          gh release create giants GiantsAndGuns.apk -R "$REPO" --latest=false \
            --title "Giants & Guns (Beta)" --notes "BETA: free to test, not for sale yet. A side-view shooter: 30 rooms, 3 giants, power-ups. Offline, no ads. Build $APP_BUILD_NUMBER." \
            && echo "Public download: https://github.com/$REPO/releases/download/giants/GiantsAndGuns.apk" || echo "::warning::Couldn't publish the public download"
      - name: Refresh the F-Droid library so phones see this update
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fdroid-repo.yml -R "$GITHUB_REPOSITORY" || echo "::warning::Couldn't start the F-Droid refresh"
