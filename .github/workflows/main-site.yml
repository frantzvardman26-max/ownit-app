name: Main site (frantzmichaelsthilairevardman.com; builds from the private repo at run time)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with: { repository: frantzvardman26-max/3D, token: "${{ secrets.BUILD_TOKEN }}", sparse-checkout: "site-main\nshop" }
      - run: pip install --quiet pillow && python3 site-main/build.py
      - name: Publish to Cloudflare Pages
        run: |
          cd site-main/dist
          npx --yes wrangler@3 pages project list | grep -q frantz-vardman-site || npx --yes wrangler@3 pages project create frantz-vardman-site --production-branch main
          npx --yes wrangler@3 pages deploy . --project-name frantz-vardman-site --branch main --commit-dirty=true
