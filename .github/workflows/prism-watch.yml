name: Prism watch (tests the live game every hour)
on:
  schedule: [{cron: '17 * * * *'}]
  workflow_dispatch:
# Every hour Prism plays the live game through its 3 bands with brand-new chaos seeds (the date + hour), so over a day it
# tries thousands of tap patterns nobody has tried. Game server calls are faked, so it never posts scores or touches real data.
# A hot spot fails this run (GitHub emails the owner). Details are encrypted: this repo is public.
permissions: {contents: read}
jobs:
  prism:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with: {repository: frantzvardman26-max/3D, token: "${{ secrets.BUILD_TOKEN }}", sparse-checkout: shop/tools/twin}
      - name: Prism on the live game
        run: |
          cd shop/tools/twin && npm init -y >/dev/null && npm i --silent playwright@1.56.1 && npx playwright install --with-deps chromium >/dev/null
          PRISM_SEED=$(date -u +%Y%m%d%H) PRISM_CHAOS=3 PRISM_STYLES=perfect,wrong node prism.js https://shop.frantzmichaelsthilairevardman.com out > summary.txt 2>&1; code=$?
          head -1 summary.txt; echo "result=$code" >> $GITHUB_ENV
      - name: Encrypt the details
        if: always()
        env: {AK: "${{ secrets.BUILD_TOKEN }}"}
        run: tar -C shop/tools/twin -cz out summary.txt | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:AK -out prism.enc
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: prism, path: prism.enc, retention-days: 7}
      - name: Hot spot? fail so the owner hears about it
        run: '[ "$result" = "0" ] || { echo "::error::Prism found a hot spot on the live game. Replay seeds are in the encrypted details."; exit 1; }'
