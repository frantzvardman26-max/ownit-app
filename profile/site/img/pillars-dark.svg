 <text x="118" y="70" class="h">Get it back</text><text x="118" y="96" class="s">ASSET RECOVERY</text><text x="28" y="138" class="d">Every copy of your work found online,</text><text x="28" y="162" class="d">then taken down or paid for, with dated</text><text x="28" y="186" class="d">evidence.</text></g></g></svg>