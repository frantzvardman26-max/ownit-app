<style>.h{font:800 30px 'Segoe UI', 'Inter', system-ui, -apple-system, Helvetica, Arial, sans-serif;fill:#F4EFE6} .s{font:700 12px 'Segoe UI', 'Inter', system-ui, -apple-system, Helvetica, Arial, sans-serif;letter-spacing:3px;fill:#D9B46A} .d{font:500 17px 'Segoe UI', 'Inter', system-ui, -apple-system, Helvetica, Arial, sans-serif;fill:#B9AE9A}
