 <text x="118" y="70" class="h">Know it</text><text x="118" y="96" class="s">ASSET INTELLIGENCE</text><text x="28" y="138" class="d">Everything you own digitized and valued</text><text x="28" y="162" class="d">in one register, each with a signed</text><text x="28" y="186" class="d">digital token.</text></g></g><g transform="translate(856,10)"><g class="c" style="animation-delay:0.4s"><rect width="403" height="230" rx="22" fill="#16130E" stroke="#2A241A"/>
