 <text x="118" y="70" class="h">Protect it</text><text x="118" y="96" class="s">ASSET PROTECTION</text><text x="28" y="138" class="d">Accounts locked down, originals sealed in</text><text x="28" y="162" class="d">an encrypted vault, weekly timestamp</text><text x="28" y="186" class="d">proofs.</text></g></g><g transform="translate(433,10)"><g class="c" style="animation-delay:0.2s"><rect width="403" height="230" rx="22" fill="#16130E" stroke="#2A241A"/>
