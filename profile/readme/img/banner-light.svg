<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Frantz Vardman: apps, asset protection and music">
<defs>
 <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#D9B46A"/><stop offset=".5" stop-color="#A97A1F"/><stop offset="1" stop-color="#D9B46A"/></linearGradient>
 <radialGradient id="o1"><stop offset="0" stop-color="#A97A1F" stop-opacity=".55"/><stop offset="1" stop-color="#A97A1F" stop-opacity="0"/></radialGradient>
 <radialGradient id="o2"><stop offset="0" stop-color="#C2185B" stop-opacity=".35"/><stop offset="1" stop-color="#C2185B" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E2D6BF" stroke-width="1"/></pattern>
 <clipPath id="c"><rect width="1280" height="400" rx="28"/></clipPath>
</defs>
<style>
 .k{font:700 15px 'Segoe UI', 'Inter', system-ui, -apple-system, Helvetica, Arial, sans-serif;letter-spacing:4px;fill:#A97A1F}
 .h{font:800 86px 'Segoe UI', 'Inter', system-ui, -apple-system, Helvetica, Arial, sans-serif;letter-spacing:-2px;fill:url(#g)}
 .r{font:500 30px 'Segoe UI', 'Inter', system-ui, -apple-system, Helvetica, Arial, sans-serif;fill:#17130C;opacity:0;animation:rot 14.0s infinite}
 .p{font:600 14px 'Segoe UI', 'Inter', system-ui, -apple-system, Helvetica, Arial, sans-serif;fill:#5E5444}
 @keyframes rot{0%{opacity:0;transform:translateY(14px)}3%{opacity:1;transform:none}22%{opacity:1;transform:none}25%{opacity:0;transform:translateY(-14px)}100%{opacity:0}}
 .r0{animation-delay:0.0s}.r1{animation-delay:3.5s}.r2{animation-delay:7.0s}.r3{animation-delay:10.5s}
 .f1{animation:drift 14s ease-in-out infinite alternate} .f2{animation:drift 18s ease-in-out infinite alternate-reverse}
 @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-60px,30px)}}
 .sh{animation:shine 6s linear infinite} @keyframes shine{from{transform:translateX(-400px)}to{transform:translateX(1700px)}}
 .cur{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
</style>
<g clip-path="url(#c)">
 <rect width="1280" height="400" fill="#FBF7EF"/>
 <rect width="1280" height="400" fill="url(#grid)" opacity=".55"/>
 <circle class="f1" cx="1050" cy="90" r="300" fill="url(#o1)"/>
 <circle class="f2" cx="1180" cy="380" r="260" fill="url(#o2)"/>
 <g transform="translate(930,70)" opacity=".9"><g fill="none" stroke="#A97A1F" stroke-width="3" stroke-linejoin="round">
 <path d="M130 10 L230 48 V128 C230 196 186 238 130 262 C74 238 30 196 30 128 V48 Z" stroke-opacity=".9"/>
 <path d="M130 40 L204 68 V128 C204 180 172 212 130 232 C88 212 56 180 56 128 V68 Z" stroke-opacity=".45"/>
 <path d="M92 134 l26 26 52 -58" stroke-width="7" stroke-linecap="round" stroke="#D9B46A" stroke-dasharray="140 200"><animate attributeName="stroke-dasharray" values="0 200;140 200;140 200;140 200" dur="5s" repeatCount="indefinite"/></path></g></g>
 <rect class="sh" x="0" y="0" width="140" height="400" fill="#D9B46A" opacity=".06" transform="skewX(-20)"/>
 <text class="k" x="64" y="96">FRANTZ MICHAEL ST HILAIRE VARDMAN</text>
 <text class="h" x="60" y="196">Frantz Vardman</text>
 <text class="r r0" x="64" y="268">Android apps and games, built from my phone</text><text class="r r1" x="64" y="268">Free Lane: my own app store</text><text class="r r2" x="64" y="268">Asset protection, intelligence and recovery</text><text class="r r3" x="64" y="268">Original beats as AceThe_Kid</text>
 <rect class="cur" x="64" y="282" width="0" height="0"/>
 <g transform="translate(64,304)"><rect width="148" height="34" rx="17" fill="none" stroke="#A97A1F" stroke-opacity=".55"/><text x="74" y="22" text-anchor="middle" class="p">18 apps &amp; games</text></g><g transform="translate(224.0,304)"><rect width="123" height="34" rx="17" fill="none" stroke="#A97A1F" stroke-opacity=".55"/><text x="61" y="22" text-anchor="middle" class="p">128 products</text></g><g transform="translate(358.8,304)"><rect width="173" height="34" rx="17" fill="none" stroke="#A97A1F" stroke-opacity=".55"/><text x="87" y="22" text-anchor="middle" class="p">Private by default</text></g><g transform="translate(544.0,304)"><rect width="207" height="34" rx="17" fill="none" stroke="#A97A1F" stroke-opacity=".55"/><text x="103" y="22" text-anchor="middle" class="p">Originals in the vault</text></g>
 <rect width="1278" height="398" x="1" y="1" rx="27" fill="none" stroke="#A97A1F" stroke-opacity=".35"/>
</g></svg>